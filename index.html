<style>

<body>
<div id="screen">
  <div id="wall"></div>
  <div id="home">
    <div id="pager"><div id="track"></div></div>
    <div id="dots"></div>
    <div id="dock" class="glass"></div>
  </div>
  <div id="appview">
    <div id="appc"><div class="nav"><span id="ntitle"></span></div><div class="scroll" id="ascroll"></div></div><div id="splash"></div>
  </div>
  <div id="hi"><i></i></div>
</div>
<script>
/* ============ APPLICATION REGISTRY ============
   Add an app by pushing one object. Everything else (Home Screen,
   Dock, App Library, search) is generated from this list.
   { id, name, category, dock?, icon:{bg, svg}, content(api) -> Node | string }  */
const APPS = [
  {
    id: 'env.jailed.sysinfo',
    name: 'iOS Jailed Environment',
    category: 'System',
    icon: {
      bg: 'linear-gradient(160deg,#4a5068 0%,#262a3a 55%,#12141d 100%)',
      svg: '<svg viewBox="0 0 60 60"><defs><radialGradient id="gi" cx=".35" cy=".25" r=".95"><stop offset="0" stop-color="#9dbcff"/><stop offset="1" stop-color="#2b52d6"/></radialGradient></defs><circle cx="30" cy="30" r="19" fill="url(#gi)"/><circle cx="30" cy="30" r="18.4" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.2"/><circle cx="30" cy="22.4" r="2.7" fill="#fff"/><rect x="27.9" y="27.2" width="4.2" height="13" rx="2.1" fill="#fff"/></svg>'
    },
    content(api) {
      const el = document.createElement('div');
      el.innerHTML = `
        <div class="hero"><div class="ic" style="background:${this.icon.bg}">${this.icon.svg}</div>

  ascroll.innerHTML = ''; const c = app.content(api); ascroll.append(c instanceof Node ? c : Object.assign(document.createElement('div'), { innerHTML: c }));
  ascroll.scrollTop = 0; nav.classList.remove('on'); $('#ntitle').textContent = app.name; requestAnimationFrame(updateScrollMotion);
  const k = collapsedTransform(iconRect());
  splash.style.background = app.icon.bg; splash.innerHTML = app.icon.svg; if (!reopen) { splash.style.transition = 'none'; splash.style.opacity = 1; }
  view.style.display = 'block'; if (!reopen) view.style.transition = 'none';
  if (!reopen) { view.style.transform = k.t; view.style.clipPath = k.clip; } appc.classList.remove('on');
  view.offsetWidth;
  const T = '.36s cubic-bezier(.2,.85,.2,1)';
  view.style.transition = `transform ${T}, clip-path ${T}`; splash.style.transition = 'opacity .2s ease .05s';
  view.style.transform = 'none'; view.style.clipPath = 'inset(0px 0px round 0px)'; splash.style.opacity = 0;
  appc.classList.add('on'); home.classList.add('away'); document.body.classList.add('inapp'); view.classList.toggle('dark', !!app.dark); document.body.classList.toggle('dk', !!app.dark);
  
}
function closeApp() {
  if (!current || closing) return; closing = true; view.style.pointerEvents = hi.style.pointerEvents = 'none';
  const k = collapsedTransform(iconRect());
  appc.classList.remove('on'); home.classList.remove('away'); document.body.classList.remove('inapp'); document.body.classList.remove('dk');
  const T = '.34s cubic-bezier(.3,.8,.25,1)';

  };

ascroll.addEventListener('scroll', () => { nav.classList.toggle('on', ascroll.scrollTop > 60); updateScrollMotion(); }, { passive: true });
document.addEventListener('click', e => {
  const t = e.target.closest('#home [data-id]'); if (!t) return;
  openApp(t.dataset.id, t.querySelector('.ic') || t);
});

/* ============ HOME INDICATOR ============ */
let hy = null, ht = 0, hv = 0, hp = 0;
hi.addEventListener('pointerdown', e => { hy = e.clientY; ht = e.timeStamp; hv = 0; hp = 0; hi.classList.add('press'); hi.setPointerCapture(e.pointerId); });
hi.addEventListener('pointermove', e => {
  if (hy == null || !current) return;
  const dy = Math.min(0, e.clientY - hy); if (dy < -4) view.style.transition = 'none'; hp = clamp(-dy / (innerHeight * .55), 0, 1);
  const dt = e.timeStamp - ht; if (dt > 0) hv = (e.clientY - hy) / dt;
  view.style.transform = `translateY(${dy * .6}px) scale(${1 - hp * .45})`; view.style.clipPath = `inset(0px 0px round ${hp * 44}px)`;
  appc.style.opacity = 1 - hp * .5; home.classList.toggle('away', hp < .35);
});
const hiEnd = e => {
  if (hy == null) return; const tap = Math.abs(e.clientY - hy) < 6; hy = null; hi.classList.remove('press');
  if (!current) return;
  appc.style.opacity = '';
  if (tap && e.clientY < $('#screen').clientHeight - 26) { hi.style.pointerEvents = 'none'; const t = document.elementFromPoint(e.clientX, e.clientY); hi.style.pointerEvents = ''; if (t) t.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: e.clientX, clientY: e.clientY })); }

  else { view.style.transition = 'transform .4s cubic-bezier(.2,.9,.25,1), clip-path .4s'; view.style.transform = 'none'; view.style.clipPath = 'inset(0px 0px round 0px)'; home.classList.add('away'); }
};
hi.addEventListener('pointerup', hiEnd); hi.addEventListener('pointercancel', hiEnd);

['gesturestart', 'gesturechange', 'gestureend'].forEach(g => document.addEventListener(g, e => e.preventDefault()));
document.addEventListener('touchstart', () => {}, { passive: true });
