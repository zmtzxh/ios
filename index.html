.stp.pend span{color:var(--sec)}.stp span{transition:color .3s}
.stp.run u{border-color:var(--sep);border-top-color:var(--blue);animation:spin .8s linear infinite}
.stp.ok u{background:#34c759;border-color:#34c759}.stp.ok u::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg);animation:tk .3s var(--ease)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes tk{from{transform:rotate(45deg) scale(0)}}
.jdone{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.jdone svg{width:58px;height:58px;margin-bottom:6px;animation:pop2 .5s var(--ease)}.jdone b{font-size:20px}.jdone small{color:var(--sec);font-size:14px}
.tick{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .15s var(--ease) forwards}@keyframes draw{to{stroke-dashoffset:0}}
.sl{min-height:100%}.sv{padding-bottom:112px;animation:fade .25s}@keyframes fade{from{opacity:0}}@keyframes pop2{from{transform:scale(.75);opacity:0}}
.lt{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:6px 16px 14px}
.pk div{flex:1}.pi{width:40px;height:40px;border-radius:22%;display:flex;align-items:center;justify-content:center;color:#fff;font:600 18px var(--font);flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}.pi.big{width:64px;height:64px;font-size:28px}
.ban{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x mandatory;touch-action:pan-x pan-y;scrollbar-width:none}.ban::-webkit-scrollbar{display:none}
.ban>div{flex:0 0 78%;height:132px;border-radius:20px;padding:16px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;scroll-snap-align:start}.ban b{font-size:20px}.ban small{opacity:.85;font-size:14px}
.dh{display:flex;align-items:center;gap:14px;padding:0 16px 4px}.dh div{flex:1;min-width:0}.dh h3{margin:0;font-size:22px}.dh small{color:var(--sec)}.back{color:var(--blue);font-size:17px;padding:0 16px 14px;cursor:pointer}
.sq{padding:0 16px 8px}.sq input{width:100%;height:38px;border-radius:10px;border:0;background:var(--sep);color:var(--tx);font:17px var(--font);padding:0 12px;outline:0;-webkit-appearance:none;-webkit-user-select:text;user-select:text}
.tabbar{position:fixed;left:14px;right:14px;bottom:calc(max(var(--safe-b)*.55,12px) + 6px);z-index:3;display:flex;gap:2px;padding:5px;border-radius:34px;background:var(--gl);-webkit-backdrop-filter:blur(26px) saturate(200%);backdrop-filter:blur(26px) saturate(200%);box-shadow:inset 2px 2px 3px -2px rgba(255,255,255,.9),inset -2px -2px 4px -2px rgba(255,255,255,.5),0 10px 28px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.1)}
.tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--sec);cursor:pointer;padding:6px 0 5px;border-radius:28px;transition:color .2s,background .25s,box-shadow .25s}.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.tabbar .on{color:var(--blue);background:var(--lz);box-shadow:inset 0 0 0 .6px rgba(255,255,255,.4),inset 1px 1px 1px -.5px rgba(255,255,255,.8)}.tabbar .on svg{animation:pop2 .35s var(--ease)}
.qbar{position:fixed;left:14px;right:14px;bottom:calc(max(var(--safe-b)*.55,12px) + 74px);z-index:3;display:flex;align-items:center;justify-content:space-between;padding:9px 10px 9px 18px;border-radius:26px;background:var(--gl);-webkit-backdrop-filter:blur(26px) saturate(200%);backdrop-filter:blur(26px) saturate(200%);box-shadow:inset 2px 2px 3px -2px rgba(255,255,255,.9),inset -2px -2px 4px -2px rgba(255,255,255,.5),0 8px 22px rgba(0,0,0,.18);font-size:15px;font-weight:500;animation:rise .35s var(--ease)}
.cons{position:fixed;inset:0;z-index:4;background:#000;color:#e6e6e6;padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 110px);display:flex;flex-direction:column}.cons pre{flex:1;margin:0;overflow:auto;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}#cbtn{position:absolute;left:16px;right:16px;bottom:calc(var(--safe-b) + 64px);text-align:center}
@media (prefers-reduced-motion:reduce){#home,.ic{transition:none}}

/* Home Screen edit mode */
#editbar{position:absolute;z-index:30;top:calc(var(--safe-t) + 8px);left:50%;transform:translate(-50%,-12px);display:flex;align-items:center;gap:12px;padding:9px 14px;border:1px solid rgba(255,255,255,.24);border-radius:22px;background:rgba(35,35,40,.62);color:#fff;font-size:13px;font-weight:650;white-space:nowrap;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#editbar button{border:0;border-radius:16px;background:#0a84ff;color:white;font:600 13px var(--font);padding:7px 13px}
#home.editing #editbar{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#home.editing .app{animation:edit-wiggle .22s ease-in-out infinite alternate;touch-action:none}
#home.editing .app:nth-child(2n){animation-delay:-.11s}
#home.editing .app .ic{filter:brightness(.96)}
#home.editing .app.dragging{animation:none;opacity:.22}
#home.editing .app.drop-target .ic{outline:2px solid rgba(255,255,255,.9);outline-offset:3px}
#edit-ghost{position:fixed;z-index:1000;pointer-events:none;width:var(--ic);display:flex;flex-direction:column;align-items:center;gap:6px;transform:translate(-50%,-50%) scale(1.08);filter:drop-shadow(0 12px 18px rgba(0,0,0,.35));}
#edit-ghost .ic{width:100%}#edit-ghost span{color:white;font-size:12px;text-shadow:0 1px 4px #000}
@keyframes edit-wiggle{from{transform:rotate(-1.35deg)}to{transform:rotate(1.35deg)}}


/* Flat finish: remove Liquid Glass from controls, app icons, App Library and dock. */
.ic{border:0!important;box-shadow:none!important;background-clip:border-box!important;transform:translateZ(0)}
.ic::before,.ic::after{display:none!important;content:none!important}
.ic svg{filter:none!important}
#dock{background:rgba(35,35,40,.48)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border:0!important;box-shadow:none!important}
#dock::before,#dock::after{display:none!important;content:none!important}
#dock.dock-clear,#dock.dock-liquid,#dock.dock-frosted{background:rgba(35,35,40,.48)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border:0!important;box-shadow:none!important}
.lib .glass,.lib .tbox,.lib .sbox,.lib .results{background:rgba(35,35,40,.72)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border:0!important;box-shadow:none!important}
.lib .glass::before,.lib .glass::after,.lib .tbox::before,.lib .tbox::after{display:none!important;content:none!important}
button,.btn,.gbtn,.jbtn,.sd-action,.sd-pill{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important;text-shadow:none!important}
button::before,button::after,.gbtn::before,.gbtn::after,.jbtn::before,.jbtn::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

</style>
</head>
<body>
<div id="screen">
  <div id="wall"></div>
  <div id="home">
    <div id="pager"><div id="track"></div></div>
    <div id="dots"></div>
    <div id="dock" class="glass"></div>
  </div>
  <div id="appview">
    <div id="appc"><div class="nav"><span id="ntitle"></span></div><div class="scroll" id="ascroll"></div></div><div id="splash"></div>
  </div>
  <div id="hi"><i></i></div>
</div>

        <div class="hero"><div class="ic" style="background:${this.icon.bg}">${this.icon.svg}</div>
          <h1>Settings</h1><p>Custom iOS Environment</p><code class="mono">${this.id}</code></div>

        <input id="wfile" type="file" accept="image/*" hidden>`;

      const sa = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
      const sync = () => { th.style.backgroundImage = `url(${api.wallpaperURL()})`; rs.style.display = api.hasCustomWallpaper() ? '' : 'none'; };
      el.querySelector('#wfile').addEventListener('change', async e => {
        const f = e.target.files[0]; if (f) { await api.setWallpaper(f); sync(); } e.target.value = '';
      });
      rs.addEventListener('click', () => { api.resetWallpaper(); sync(); });
      sync();
      el.querySelector('#factory-reset').addEventListener('click', () => {

        const iconScale = settings.querySelector('#icon-scale-level');

        const compactGrid = settings.querySelector('#compact-grid-toggle');
        if (compactGrid) compactGrid.addEventListener('change', () => api.setCompactGrid(compactGrid.checked));
        const tapFeedback = settings.querySelector('#tap-feedback-toggle');
        if (tapFeedback) tapFeedback.addEventListener('change', () => api.setTapFeedback(tapFeedback.checked));
        const launchBlur = settings.querySelector('#launch-blur-toggle');
        if (launchBlur) launchBlur.addEventListener('change', () => api.setLaunchBlur(launchBlur.checked));
        const dockBounce = settings.querySelector('#dock-bounce-toggle');
        if (dockBounce) dockBounce.addEventListener('change', () => api.setDockBounce(dockBounce.checked));
      }
      return el;
    }

    content(api) {
      const el = document.createElement('div'); el.className = 'jbv';
      const S = ['Preparing environment', 'Applying system profile', 'Mounting system image', 'Bootstrapping packages', 'Installing Sileo', 'Installing NewTerm', 'Installing Tweak Manager', 'Refreshing app library'];
      el.innerHTML = `<div class='hero'><div class='ic' id='jic' style='background:${this.icon.bg}'>${this.icon.svg}</div><h1>plikzach</h1><p>iOS environment setup</p></div>
        <div class='group'><div class='row'><span>Status</span><b id='jst'></b></div><div class='row'><span>Packages</span><b id='jpk'></b></div></div>
        <div class='gh'>Optional components</div><div class='group'><label class='hexopt'><span class='hextext'><b style='font-weight:600'>Install Hexagon Store</b><small>App Store for jailbreak-compatible apps</small></span><input id='hexagon-choice' type='checkbox' aria-label='Install Hexagon Store'></label><label class='hexopt'><span class='hextext'><b style='font-weight:600'>Install TrollKlip</b><small>IPA library and installer</small></span><input id='trollklip-choice' type='checkbox' aria-label='Install TrollKlip'></label></div><div class='gf'>Choose which utilities to add to your Home Screen.</div><div><div class='gh'>Progress</div><div class='group'><div class='bar'><i id='jbar'></i></div>${S.map(x => `<div class='row stp pend'><span>${x}</span><u></u></div>`).join('')}</div></div>
        <div class='jbtnw' id='jw'><button class='jbtn' id='jgo'>Jailbreak</button></div>
        `;
      const $$ = x => el.querySelector(x), rows = [...el.querySelectorAll('.stp')], bar = $$('#jbar'), jw = $$('#jw');
      const status = () => { const d = api.jb.done; $$('#jst').textContent = d ? 'Environment Ready' : 'Not Set Up'; $$('#jpk').textContent = d ? (api.jb.inst.includes('hexagonstore') ? 'Sileo, NewTerm, Tweak Manager, Hexagon Store' : 'Sileo, NewTerm, Tweak Manager') : 'None'; };
      const hexChoice = $$('#hexagon-choice');
      try { hexChoice.checked = localStorage.getItem('ije.installHexagon') === '1' || api.jb.inst.includes('hexagonstore'); } catch (_) {}
      hexChoice.addEventListener('change', () => { try { localStorage.setItem('ije.installHexagon', hexChoice.checked ? '1' : '0'); } catch (_) {} if (api.jb.done) { if (hexChoice.checked) installHexagonStore(); else removeHexagonStore(); status(); $$('#jpk').textContent = api.jb.inst.includes('hexagonstore') ? 'Sileo, NewTerm, Tweak Manager, Hexagon Store' : 'Sileo, NewTerm, Tweak Manager'; } });

  content(api) {
    const el = document.createElement('div');
    const names = { zeptagonreborn:'ZeptagonReborn', scrollanim:'ScrollAnim', motionicons:'MotionIcons', appbounce:'AppBounce', dockglass:'DockGlass', iconlabels:'IconLabels', wallpaperdim:'WallpaperDim', iconscale:'IconScale', compactgrid:'CompactGrid', tapfeedback:'TapFeedback', launchblur:'LaunchBlur', dockbounce:'DockBounce', iconrows:'IconRows' };
    const descriptions = { zeptagonreborn:'Double-tap Home Screen to summon and dismiss a black hole.', scrollanim:'Choose live scroll effects for app pages.', motionicons:'Tilt and shake controls for colliding Home Screen icons.', appbounce:'Springy icon launch animation.', dockglass:'Choose Liquid, Crystal Clear or Frosted dock glass.', iconlabels:'Show or hide Home Screen labels.', wallpaperdim:'Adjust wallpaper darkness.', iconscale:'Resize Home Screen and dock icons up to 175%.', compactgrid:'Reduce vertical spacing between icon rows.', tapfeedback:'Add a visual response when tapping icons.', launchblur:'Blur and dim wallpaper behind open apps.', dockbounce:'Bounce dock icons when launched.', iconrows:'Choose 3 to 6 icons per Home Screen row.' };
    const draw = () => {
      const installed = api.jb.inst;
      const rows = TWEAK_PACKAGE_IDS.map(id => `<div class="row" style="gap:10px"><div style="flex:1;min-width:0"><b>${names[id]}</b><div style="font-size:12px;color:var(--sec);margin-top:3px;line-height:1.35">${descriptions[id]}</div></div><button class="gbtn ${installed.includes(id)?'rm':''}" data-package="${id}">${installed.includes(id)?'Remove':'Install'}</button></div>`).join('');
      let controls = '';
      if (installed.includes('scrollanim')) controls += `<div class="row"><label for="tm-scroll">Scroll animation</label><select id="tm-scroll" data-setting="scroll" style="border:0;background:transparent;color:var(--blue);font:15px var(--font)"><option value="ios">iOS Smooth</option><option value="fx-fade">Fade</option><option value="fx-slide">Slide</option><option value="fx-zoom">Zoom</option><option value="none">None</option></select></div>`;
      if (installed.includes('motionicons')) controls += `<div class="row"><span>Motion physics</span><button class="gbtn" data-action="motion">${api.tweaks.motionEnabled?'Disable':'Enable'}</button></div><div class="row"><span>Sensor status</span><b>${api.tweaks.motionPermission || 'Not requested'}</b></div>`;
      if (installed.includes('zeptagonreborn')) controls += `<div class="row"><span>ZeptagonReborn</span><button class="gbtn" data-action="zeptagon">${api.tweaks.zeptagonEnabled?'Disable':'Enable'}</button></div>`;
      if (installed.includes('appbounce')) controls += `<div class="row"><span>Jump animation</span><button class="gbtn" data-action="bounce">${api.tweaks.appBounceEnabled?'Enabled':'Disabled'}</button></div>`;
      if (installed.includes('dockglass')) controls += `<div class="row"><label for="tm-dock">Dock appearance</label><select id="tm-dock" data-setting="dock" style="border:0;background:transparent;color:var(--blue);font:15px var(--font)"><option value="liquid">Liquid Glass</option><option value="clear">Crystal Clear</option><option value="frosted">Frosted Glass</option></select></div>`;
      if (installed.includes('iconlabels')) controls += `<div class="row"><span>Hide icon labels</span><input type="checkbox" data-action="labels" ${api.tweaks.labelsHidden?'checked':''} style="width:22px;height:22px;accent-color:var(--blue)"></div>`;

    draw();
    el.addEventListener('click', async ev => {
      const pkg=ev.target.closest('button[data-package]');

        ev.preventDefault();
        const id=pkg.dataset.package;

        else api.jb.inst.push(id);
        api.saveJB(); syncInstalledTweaks(); draw(); return;
      }
      // Only action buttons should trigger a redraw. Checkbox clicks must be left
      // alone until their change event fires, otherwise the input is replaced
      // before the browser can commit its checked state (the old checkbox bug).
      const action=ev.target.closest('button[data-action]');
      if(!action) return;

      if(action.dataset.action==='motion') await api.enableMotion();

      else return;
      draw();
    });

    el.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.setting==='scale'){api.setIconScale(Number(t.value));const v=el.querySelector('#tm-scale-value');if(v)v.textContent=t.value+'%';}else if(t.dataset.setting==='dim'){api.setWallpaperDim(Number(t.value));const v=el.querySelector('#tm-dim-value');if(v)v.textContent=t.value+'%';}});
    return el;
  }
};

    icon: { bg: 'linear-gradient(135deg,#ff6b6b,#f9c74f,#43aa8b,#577590)', svg: '<svg viewBox="0 0 60 60"><path d="M30 8a22 22 0 1 0 0 44h4a5 5 0 0 0 0-10h-2a4 4 0 0 1 0-8h5A15 15 0 0 0 30 8" fill="#fff"/><g fill="#ff6b6b"><circle cx="19" cy="22" r="3"/></g><circle cx="30" cy="17" r="3" fill="#f9c74f"/><circle cx="41" cy="25" r="3" fill="#43aa8b"/></svg>' },
    content() {
      const e=document.createElement('div');e.innerHTML=`<div class="hero"><h1>Color Studio</h1><p>Build a color palette and preview it.</p></div><div id="color-preview" style="height:150px;margin:0 18px 16px;border-radius:22px;background:linear-gradient(135deg,#ff6b6b,#f9c74f,#43aa8b);display:grid;place-items:center;color:white;font-size:20px;font-weight:700;text-shadow:0 1px 5px #0005">Your palette</div><div id="color-swatches" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 18px">${['#ff6b6b','#f9c74f','#43aa8b','#577590','#9b5de5','#f15bb5','#00bbf9','#00f5d4'].map(c=>`<button data-color="${c}" aria-label="${c}" style="height:52px;border:0;border-radius:14px;background:${c}"></button>`).join('')}</div><div style="text-align:center;margin:16px"><button id="color-random" class="gbtn">Random palette</button></div><div class="gf">Tap swatches to build your own four-color gradient.</div>`;
      let chosen=['#ff6b6b','#f9c74f','#43aa8b','#577590'];const paint=()=>{e.querySelector('#color-preview').style.background=`linear-gradient(135deg,${chosen.join(',')})`;};e.querySelector('#color-swatches').addEventListener('click',ev=>{const b=ev.target.closest('[data-color]');if(!b)return;chosen.push(b.dataset.color);if(chosen.length>4)chosen.shift();paint();});e.querySelector('#color-random').addEventListener('click',()=>{const all=[...e.querySelectorAll('[data-color]')].map(b=>b.dataset.color);chosen=Array.from({length:4},()=>all[Math.floor(Math.random()*all.length)]);paint();});paint();return e;
    }
  },
  {
    id: 'app.bulkinstaller', name: 'Bulk Installer', category: 'Utilities',
    icon: { bg: 'linear-gradient(145deg,#36d1a1,#167c68)', svg: '<svg viewBox="0 0 60 60"><path d="M30 8v28m-11-11 11 11 11-11M12 43v7h36v-7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
    content() {
      const e=document.createElement('div');e.innerHTML=`<div class="hero"><h1>Bulk Installer</h1><p>Set up your tools and utilities in one tap.</p></div><div class="group" style="margin:0 16px"><div class="row"><span>Available tweaks</span><b>${TWEAK_PACKAGE_IDS.length}</b></div><div class="row"><span>Hexagon Store apps</span><b>${HEXAGON_CATALOG.length}</b></div><div class="row"><span>Already installed</span><b id="bulk-count">0</b></div></div><div style="padding:18px;text-align:center"><button id="bulk-install" class="gbtn" style="background:#34c759;color:#fff;padding:13px 22px">Install everything</button></div><div id="bulk-status" class="gf">This installs every catalogued tweak through Sileo and every app in Hexagon Store.</div>`;
      const count=e.querySelector('#bulk-count'),status=e.querySelector('#bulk-status'),btn=e.querySelector('#bulk-install');const refresh=()=>{count.textContent=String(TWEAK_PACKAGE_IDS.filter(x=>JB.inst.includes(x)).length+HEXAGON_CATALOG.filter(a=>byId(a.id)).length);};refresh();btn.addEventListener('click',()=>{let added=0;TWEAK_PACKAGE_IDS.forEach(id=>{if(!JB.inst.includes(id)){JB.inst.push(id);added++;}});HEXAGON_CATALOG.forEach(a=>{if(!byId(a.id)){APPS.push(a);if(!JB.inst.includes('hexapp:'+a.id))JB.inst.push('hexapp:'+a.id);added++;}});saveJB();refresh();status.textContent=added?`All done! ${added} items installed. Open Sileo or return Home to see your apps.`:'Everything is already installed.';btn.textContent='Install again';build();});return e;
    }
  }
];
function installHexagonApp(id) {
  const app = HEXAGON_CATALOG.find(a => a.id === id);
  if (!app || byId(id)) return;
  APPS.push(app); if (!JB.inst.includes('hexapp:' + id)) JB.inst.push('hexapp:' + id);
  saveJB(); build();
}
function uninstallHexagonApp(id) {
  const i=APPS.findIndex(a=>a.id===id);
  if(i>=0) APPS.splice(i,1);
  JB.inst=JB.inst.filter(x=>x!=='hexapp:'+id);
  saveJB(); build();
}

  content(api) {
    const el = document.createElement('div'); el.className = 'sl';
    const draw = () => {
      const cards = HEXAGON_CATALOG.map(a => {
        const installed = !!byId(a.id);
        return `<div class="row pk" style="align-items:center;gap:12px"><div class="ic" style="width:48px;flex:0 0 48px;background:${a.icon.bg}">${a.icon.svg}</div><div style="flex:1;min-width:0"><span>${a.name}</span><small>${a.category} · App</small></div><button class="gbtn ${installed?'rm':''}" data-app-action="${a.id}">${installed?'Uninstall':'Get'}</button></div>`;
      }).join('');
      el.innerHTML = `<div class="hero"><div class="ic" style="background:${this.icon.bg}">${this.icon.svg}</div><h1>Hexagon Store</h1><p>Apps for your environment</p></div><div class="gh">Discover Apps</div><div class="group">${cards}</div><div class="gf">Hexagon Store distributes standalone apps only. Tweaks remain in Sileo.</div>`;
      el.querySelectorAll('[data-app-action]').forEach(b => b.addEventListener('click', () => {
        const id=b.dataset.appAction;
        if(byId(id)) uninstallHexagonApp(id); else installHexagonApp(id);
        draw();
      }));
    };
    draw(); return el;
  }
};
function installHexagonStore() { if (!APPS.some(a=>a.id==='app.hexagonstore')) { APPS.push(HEXAGON_APP); build(); } if (!JB.inst.includes('hexagonstore')) JB.inst.push('hexagonstore'); saveJB(); }

const TROLLKLIP_APP = {

    let chosen=null;
    const read=()=>{let items=[];try{items=JSON.parse(localStorage.getItem('ije.trollklip.apps')||'[]')}catch(_){};list.innerHTML=items.length?items.map((x,i)=>`<div class="row"><span>${escapeHTML(x.name)}</span><b style="color:#34c759">Installed</b></div>`).join(''):'<div class="row"><span>No apps installed</span></div>';};
    picked.addEventListener('click',()=>file.click());
    file.addEventListener('change',()=>{chosen=file.files&&file.files[0]||null;selected.textContent=chosen?chosen.name:'No file selected';install.disabled=!chosen;});
    install.addEventListener('click',()=>{
      if(!chosen)return;
      const name=chosen.name.replace(/\.ipa$/i,'').trim()||'Untitled App';
      let items=[];
      try{items=JSON.parse(localStorage.getItem('ije.trollklip.apps')||'[]');if(!Array.isArray(items))items=[];}catch(_){items=[];}
      if(!items.some(x=>x&&typeof x.name==='string'&&x.name.toLowerCase()===name.toLowerCase()))items.push({name});
      let saved=false;
      try{localStorage.setItem('ije.trollklip.apps',JSON.stringify(items));saved=true;}catch(_){}
      // Add the shortcut to the live app registry immediately; do not rely only on
      // re-reading storage, which can fail on browsers with restricted storage.
      const shortcut=trollKlipShortcut(name);
      if(!byId(shortcut.id))APPS.push(shortcut);
      syncTrollKlipShortcuts();
      build();
      selected.textContent=name+' added to Home Screen';
      chosen=null;file.value='';install.disabled=true;read();
      const note=e.querySelector('#tk-result-note');
      if(note)note.textContent=saved?'The app icon is now on your Home Screen.':'The icon is available for this session; browser storage is unavailable.';
      const go=e.querySelector('#tk-home');
      if(go){go.hidden=false;go.onclick=()=>closeApp();}
    });
    read();return e;
  }
};

function syncTrollKlipShortcuts(){let items=[];try{items=JSON.parse(localStorage.getItem('ije.trollklip.apps')||'[]')}catch(_){};for(const x of items){const id='trollklip.ipa.'+encodeURIComponent(x.name);if(!byId(id))APPS.push(trollKlipShortcut(x.name));}}

const WKEY = 'ije.wallpaper';
let defaultWall = '', customWall = null;
function makeDefaultWall() {
  /* Procedural keycap wallpaper: a skewed grid of rounded keys with a few coloured accent keys (fixed 393x852 canvas, scaled with cover). */
  const W = 393, H = 852, k = 2, p = 76;
  const c = document.createElement('canvas'); c.width = W * k; c.height = H * k;
  const x = c.getContext('2d'); x.scale(k, k);
  x.fillStyle = '#5f5f65'; x.fillRect(0, 0, W, H);
  const ux = p * .95, uy = -p * .38, vx = p * .46, vy = p * .8, ox0 = -W * .25, oy0 = H * .08;
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pal = [['#cf6461', '#8f3b3a'], ['#8f6fd0', '#5a3e9e'], ['#4f7cd0', '#30508f'], ['#ead86e', '#a99b3d'], ['#bf7d4e', '#83512e'], ['#607a68', '#3b5043']];
  const rr = (w, h, r) => { x.beginPath(); x.moveTo(r, 0); x.arcTo(w, 0, w, h, r); x.arcTo(w, h, 0, h, r); x.arcTo(0, h, 0, 0, r); x.arcTo(0, 0, w, 0, r); x.closePath(); };
  const T = (ox, oy) => x.setTransform(k * ux, k * uy, k * vx, k * vy, k * ox, k * oy);
  for (let j = -3; j < 17; j++) for (let i = -3; i < 16; i++) {
    const ox = ox0 + i * ux + j * vx, oy = oy0 + i * uy + j * vy;
    if (ox < -p * 2 || ox > W + p || oy < -p * 2 || oy > H + p * 2) continue;
    const wide = rnd() < .1, wu = wide ? 2 : 1;
    const acc = ox > W * .3 && oy > H * .5 && rnd() < .2 ? pal[Math.floor(rnd() * pal.length)] : null;
    const lift = acc ? 6 : 0, d = acc ? 13 : 9, w = wu - .12;
    x.save();
    T(ox + .06 * ux + .06 * vx, oy + d + .06 * uy + .06 * vy); x.shadowColor = 'rgba(0,0,0,.4)'; x.shadowBlur = 14; x.shadowOffsetY = 6;
    x.fillStyle = acc ? acc[1] : '#8e8e94'; rr(w, .88, .17); x.fill(); x.shadowColor = 'transparent';
    T(ox + .06 * ux + .06 * vx, oy - lift + .06 * uy + .06 * vy);
    const g = x.createLinearGradient(0, 0, w * .6, 1); g.addColorStop(0, acc ? acc[0] : '#dcdce0'); g.addColorStop(1, acc ? acc[0] : '#bcbcc2');
    x.fillStyle = g; rr(w, .88, .17); x.fill();
    x.translate(.14, .14); x.fillStyle = 'rgba(0,0,0,.06)'; rr(w - .28, .6, .12); x.fill();
    x.restore();
    if (wide) i++;
  }
  x.setTransform(k, 0, 0, k, 0, 0);
  const v = x.createRadialGradient(W * .5, H * .5, H * .12, W * .5, H * .5, H * .78);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.42)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  return c.toDataURL('image/jpeg', .9);
}

function createSocialDemo(item) {
  const isYT = item.id === 'youtube';
  const e = document.createElement('div');
  e.className = 'social-demo ' + (isYT ? 'social-youtube' : 'social-tiktok');
  const posts = isYT ? [
    {user:'Pixel Planet',title:'A tiny universe in motion ✨',tag:'#animation #space',kind:'SPACE'},
    {user:'Daily Builds',title:'Satisfying neon desk setup',tag:'#setup #creative',kind:'GLOW'},
    {user:'Loop Lab',title:'This loop never gets old',tag:'#loop #visuals',kind:'LOOP'}
  ] : [
    {user:'@pixelplanet',title:'wait for the final effect ✨',tag:'#fyp #animation',kind:'VIBE'},
    {user:'@dailybuilds',title:'purple setup appreciation 💜',tag:'#desksetup',kind:'GLOW'},
    {user:'@looplab',title:'one more time 🔁',tag:'#satisfying',kind:'LOOP'}
  ];
  const seedComments = [
    ['This is so cool 🔥','Need a tutorial!','The colours are amazing 💜'],
    ['clean setup omg','Where did you get the lights?','10/10 vibe'],
    ['I watched this 20 times','smooth loop','more of these please 🙌']
  ];
  const counts = posts.map((_,i)=>Math.floor(1200 + Math.random()*98000 + i*7400));
  const key = 'ije.social.'+item.id;
  let saved={}; try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{};}catch(_){}
  const esc = v => String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  e.innerHTML = `<style>
    .social-demo{font-family:var(--font);min-height:100%;background:var(--bg);color:var(--tx)}
    .sd-top{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .sd-brand{font-size:23px;font-weight:900;letter-spacing:-1px}.sd-pill{border:0;border-radius:20px;padding:8px 13px;background:var(--lz);color:var(--tx);font-weight:700}
    .sd-post{padding:14px 14px 18px;border-bottom:8px solid var(--cell)}.sd-user{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;margin-bottom:10px}.sd-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:white;background:linear-gradient(135deg,#ff4da6,#6546ff);font-weight:900}
    .sd-art{height:230px;border-radius:18px;overflow:hidden;position:relative;display:grid;place-items:center;color:white;background:linear-gradient(135deg,#17133e,#7716a8,#ff3e9e);isolation:isolate}
    .sd-art:before,.sd-art:after{content:'';position:absolute;border-radius:50%;filter:blur(2px);z-index:-1;animation:sd-drift 6s ease-in-out infinite alternate}
    .sd-art:before{width:190px;height:190px;left:-25px;top:20px;background:radial-gradient(circle at 35% 35%,#fff9,#00d9ff 28%,#7b2cff 65%,transparent 72%)}
    .sd-art:after{width:220px;height:220px;right:-45px;bottom:-70px;background:radial-gradient(circle at 35% 35%,#fff9,#ff38bb 25%,#592cff 65%,transparent 72%);animation-delay:-2s}
    .sd-art .sd-word{font-size:36px;font-weight:1000;letter-spacing:4px;text-shadow:0 4px 24px #0008;animation:sd-pop 3.4s ease-in-out infinite}
    .sd-art .sd-orbit{position:absolute;width:145px;height:145px;border:2px solid #ffffff99;border-radius:34%;transform:rotate(35deg);animation:sd-spin 12s linear infinite}
    .sd-art .sd-orbit:nth-child(2){width:100px;height:100px;border-color:#ffffff55;animation-direction:reverse;animation-duration:8s}
    .sd-art .sd-play{position:absolute;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#0005;backdrop-filter:blur(8px);font-size:21px;opacity:.9}
    @keyframes sd-drift{to{transform:translate(24px,-17px) scale(1.12)}}@keyframes sd-pop{50%{transform:scale(1.08) rotate(-2deg)}}@keyframes sd-spin{to{transform:rotate(395deg)}}
    .sd-title{font-size:15px;font-weight:750;line-height:1.35;margin:10px 0 4px}.sd-sub{font-size:12px;color:var(--sec)}.sd-actions{display:flex;gap:9px;align-items:center;margin-top:12px;flex-wrap:wrap}.sd-action{border:0;border-radius:20px;padding:8px 12px;background:var(--cell);color:var(--tx);font-weight:700;font-size:13px}.sd-action.liked{color:#ff3158;background:color-mix(in srgb,#ff3158 13%,var(--cell))}.sd-comments{display:none;padding:10px 0 0}.sd-comments.open{display:block}.sd-comment{font-size:13px;line-height:1.4;padding:7px 0;border-bottom:1px solid var(--line)}.sd-comment b{margin-right:5px}.sd-comment-form{display:flex;gap:7px;margin-top:9px}.sd-comment-form input{min-width:0;flex:1;border:0;border-radius:18px;padding:10px 12px;background:var(--cell);color:var(--tx);font:14px var(--font)}.sd-comment-form button{border:0;border-radius:18px;padding:0 13px;background:#1685ed;color:white;font-weight:700}
    .social-tiktok .sd-post{padding:10px 12px 18px}.social-tiktok .sd-art{height:420px;border-radius:20px}.social-tiktok .sd-art .sd-word{font-size:42px}.sd-tiktok-actions{position:absolute;right:12px;bottom:16px;display:grid;gap:14px;text-align:center}.sd-tiktok-actions button{width:44px;height:44px;border:0;border-radius:50%;background:#0006;color:white;font-size:20px}.sd-tiktok-actions small{display:block;font-size:11px;color:white;text-shadow:0 1px 4px #000}.sd-note{padding:14px 16px;color:var(--sec);font-size:12px;text-align:center}
  </style>
  <div class="sd-top"><div class="sd-brand">${isYT?'▶ YouTube':'♪ TikTok'}</div><button class="sd-pill" data-refresh>↻ Refresh</button></div>
  <div class="sd-feed">${posts.map((post,i)=>{
    const liked=!!(saved.liked&&saved.liked[i]); const likes=(saved.counts&&saved.counts[i])||counts[i];
    const comments=(saved.comments&&saved.comments[i])||seedComments[i];
    return `<article class="sd-post" data-post="${i}"><div class="sd-user"><span class="sd-avatar">${post.user.replace(/[^a-z]/gi,'').slice(0,1).toUpperCase()}</span><span>${post.user}</span><span style="margin-left:auto;color:var(--sec);font-weight:500">${isYT?'•  Suggested':'For You ·'}</span></div>
      <div class="sd-art" role="img" aria-label="Video preview"><span class="sd-orbit"></span><span class="sd-orbit"></span><span class="sd-word">${post.kind}</span><span class="sd-play">▶</span>
      ${!isYT?`<div class="sd-tiktok-actions"><div><button data-like class="${liked?'liked':''}">${liked?'♥':'♡'}</button><small data-count>${likes.toLocaleString()}</small></div><div><button data-comments>☰</button><small>Comments</small></div><div><button data-share>↗</button><small>Share</small></div></div>`:''}</div>
      <div class="sd-title">${post.title}</div><div class="sd-sub">${post.tag} · ${isYT?'Featured channel':'Original sound'}</div>
      ${isYT?`<div class="sd-actions"><button class="sd-action ${liked?'liked':''}" data-like>♥ <span data-count>${likes.toLocaleString()}</span></button><button class="sd-action" data-comments>▤ Comments (${comments.length})</button><button class="sd-action" data-share>↗ Share</button></div>`:''}
      <div class="sd-comments"><b style="font-size:13px">Comments</b><div class="sd-comment-list">${comments.map(c=>`<div class="sd-comment"><b>@${['nova','pixel_fan','mika'][Math.floor(Math.random()*3)]}</b>${esc(c)}</div>`).join('')}</div><form class="sd-comment-form"><input maxlength="120" placeholder="Add a comment…"><button>Post</button></form></div>
    </article>`;
  }).join('')}</div><div class="sd-note">Your likes and comments are saved on this device.</div>`;
  const persist=()=>{try{localStorage.setItem(key,JSON.stringify(saved));}catch(_){}};
  e.addEventListener('click',ev=>{
    if(ev.target.closest('[data-refresh]')){e.querySelectorAll('.sd-art').forEach(a=>{a.style.filter='hue-rotate('+Math.floor(Math.random()*300)+'deg)';a.style.transform='scale(.985)';setTimeout(()=>{if(a.isConnected){a.style.filter='';a.style.transform='';}},260);});return;}
    const post=ev.target.closest('.sd-post'); if(!post)return; const i=Number(post.dataset.post);
    if(ev.target.closest('[data-like]')){saved.liked=saved.liked||{};saved.counts=saved.counts||{};const was=!!saved.liked[i];saved.liked[i]=!was;saved.counts[i]=(saved.counts[i]||counts[i])+(was?-1:1);const b=post.querySelectorAll('[data-like]');b.forEach(x=>{x.classList.toggle('liked',!was);if(x.tagName==='BUTTON'&&x.closest('.sd-tiktok-actions'))x.textContent=!was?'♥':'♡';});post.querySelectorAll('[data-count]').forEach(x=>x.textContent=saved.counts[i].toLocaleString());persist();}
    if(ev.target.closest('[data-comments]'))post.querySelector('.sd-comments').classList.toggle('open');
    if(ev.target.closest('[data-share]')){const b=ev.target.closest('[data-share]');b.textContent='✓ Copied';setTimeout(()=>{if(b.isConnected)b.textContent='↗ Share';},900);}
  });
  e.addEventListener('submit',ev=>{const form=ev.target.closest('.sd-comment-form');if(!form)return;ev.preventDefault();const input=form.querySelector('input'),v=input.value.trim();if(!v)return;const post=form.closest('.sd-post'),i=Number(post.dataset.post);saved.comments=saved.comments||{};saved.comments[i]=saved.comments[i]||seedComments[i].slice();saved.comments[i].push(v);const row=document.createElement('div');row.className='sd-comment';const b=document.createElement('b');b.textContent='@you';row.append(b,document.createTextNode(v));post.querySelector('.sd-comment-list').append(row);input.value='';persist();});
  return e;
}

function installStoreApp(id) {
  const item = APP_STORE_CATALOG.find(x=>x.id===id);
  if (!item || byId('store.'+id)) return;
  const app = {
    id:'store.'+item.id, name:item.name, category:item.category,
    icon:{bg:'transparent',svg:appStoreIcon(item.image)},
    content() {
      if (item.id === 'youtube' || item.id === 'tiktok') return createSocialDemo(item);
      const e=document.createElement('div');
      e.innerHTML=`<div style="padding:30px 22px 20px;text-align:center">
        <div style="width:92px;height:92px;margin:0 auto 16px;border-radius:22px;overflow:hidden;box-shadow:0 5px 18px #0002">${appStoreIcon(item.image)}</div>
        <h1 style="font-size:27px;margin:0 0 6px">${item.name}</h1>
        <p style="color:var(--sec);margin:0">${item.subtitle}</p>
        <div style="margin:24px auto;padding:15px;border-radius:18px;background:var(--cell);text-align:left">
          <b>About this app</b><p style="color:var(--sec);font-size:14px;line-height:1.45;margin:8px 0 0">${item.description}</p>
        </div>
      </div>`;
      return e;
    }
  };
  APPS.push(app);
  if(!JB.inst.includes('appstoreapp:'+id)) JB.inst.push('appstoreapp:'+id);
  saveJB(); build();
}
function uninstallStoreApp(id) {
  const appId='store.'+id;
  const i=APPS.findIndex(a=>a.id===appId);
  if(i>=0) APPS.splice(i,1);
  JB.inst=JB.inst.filter(x=>x!=='appstoreapp:'+id);
  saveJB(); build();
}

/* ============ HOME SCREEN ICON EDITING ============ */
const HOME_ORDER_KEY = 'ije.homeIconOrder.v1';
let editSuppressClick = false, editPressTimer = null, editDrag = null, editGhost = null;
const editBar = document.createElement('div');
editBar.id = 'editbar';
editBar.innerHTML = '<span>Hold and drag to rearrange</span><button type="button" id="edit-done">Done</button>';
home.append(editBar);
editBar.querySelector('#edit-done').addEventListener('click', exitHomeEdit);
function enterHomeEdit(){
  if(home.classList.contains('editing')) return;
  home.classList.add('editing');
  pager.style.touchAction='none';
}
function exitHomeEdit(){
  clearTimeout(editPressTimer); editPressTimer=null;
  if(editDrag) finishHomeDrag();
  home.classList.remove('editing'); pager.style.touchAction='pan-y';
  document.querySelectorAll('#home .app').forEach(a=>a.classList.remove('dragging','drop-target'));
}
function saveHomeOrder(){
  const ids=[];
  dock.querySelectorAll('.app[data-id]').forEach(n=>ids.push({id:n.dataset.id,dock:true}));
  track.querySelectorAll('.page .app[data-id]').forEach(n=>ids.push({id:n.dataset.id,dock:false}));
  const map=new Map(APPS.map(a=>[a.id,a]));
  ids.forEach(x=>{const a=map.get(x.id);if(a)a.dock=x.dock;});
  const ordered=ids.map(x=>map.get(x.id)).filter(Boolean);
  APPS.forEach(a=>{if(!ordered.includes(a))ordered.push(a);});
  APPS.splice(0,APPS.length,...ordered);
  try{localStorage.setItem(HOME_ORDER_KEY,JSON.stringify(ids));}catch(_){}
}
function restoreHomeOrder(){
  try{
    const saved=JSON.parse(localStorage.getItem(HOME_ORDER_KEY)||'[]'); if(!Array.isArray(saved)||!saved.length)return;
    const map=new Map(APPS.map(a=>[a.id,a])); const ordered=[];
    saved.forEach(x=>{const a=map.get(x.id);if(a){a.dock=!!x.dock;ordered.push(a);map.delete(x.id);}});
    ordered.push(...map.values()); APPS.splice(0,APPS.length,...ordered);
  }catch(_){}
}
function beginHomeDrag(node,x,y){
  const app=byId(node.dataset.id); if(!app)return;
  editDrag={node,id:app.id,pointerId:null}; node.classList.add('dragging');
  editGhost=node.cloneNode(true); editGhost.id='edit-ghost'; editGhost.classList.remove('dragging');
  document.body.append(editGhost); moveEditGhost(x,y);
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}
}
function moveEditGhost(x,y){if(editGhost){editGhost.style.left=x+'px';editGhost.style.top=y+'px';}}
function finishHomeDrag(){
  if(!editDrag)return;
  editDrag.node.classList.remove('dragging');
  if(editGhost)editGhost.remove(); editGhost=null;
  document.querySelectorAll('#home .drop-target').forEach(n=>n.classList.remove('drop-target'));
  editDrag=null; saveHomeOrder(); build(); home.classList.add('editing');
}
function reorderAtPoint(x,y){
  if(!editDrag)return;
  const node=editDrag.node;
  const dockRect=dock.getBoundingClientRect();
  if(y>=dockRect.top-18){
    const siblings=[...dock.querySelectorAll('.app')].filter(n=>n!==node);
    const target=siblings.find(n=>{const r=n.getBoundingClientRect();return x<r.left+r.width/2;});
    if(target)dock.insertBefore(node,target);else dock.append(node);
    return;
  }
  const candidates=[...track.querySelectorAll('.page .app')].filter(n=>n!==node);
  if(!candidates.length)return;
  let nearest=null,best=Infinity;
  for(const n of candidates){const r=n.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const d=(cx-x)**2+(cy-y)**2;if(d<best){best=d;nearest=n;}}
  if(!nearest)return;
  const r=nearest.getBoundingClientRect();
  const before=(y<r.top+r.height/2)||(Math.abs(y-(r.top+r.height/2))<r.height/2&&x<r.left+r.width/2);
  nearest.parentNode.insertBefore(node,before?nearest:nearest.nextSibling);
}
home.addEventListener('pointerdown',e=>{
  const node=e.target.closest('.app[data-id]'); if(!node||!home.contains(node))return;
  if(e.target.closest('#editbar'))return;
  clearTimeout(editPressTimer);
  const startX=e.clientX,startY=e.clientY;
  editPressTimer=setTimeout(()=>{
    enterHomeEdit(); beginHomeDrag(node,startX,startY); editSuppressClick=true;
  },520);
  node.dataset.pressX=String(startX);node.dataset.pressY=String(startY);
  e.stopPropagation();
},{capture:true});
home.addEventListener('pointermove',e=>{
  if(editPressTimer){const node=e.target.closest('.app[data-id]')||document.querySelector('#home .app[data-id][data-press-x]');if(node){const dx=e.clientX-Number(node.dataset.pressX||e.clientX),dy=e.clientY-Number(node.dataset.pressY||e.clientY);if(Math.hypot(dx,dy)>12){clearTimeout(editPressTimer);editPressTimer=null;}}}
  if(!editDrag)return;
  e.preventDefault();moveEditGhost(e.clientX,e.clientY);reorderAtPoint(e.clientX,e.clientY);
},{capture:true,passive:false});
function clearHomePress(){clearTimeout(editPressTimer);editPressTimer=null;document.querySelectorAll('#home .app[data-press-x]').forEach(n=>{delete n.dataset.pressX;delete n.dataset.pressY;});}
document.addEventListener('pointerup',()=>{clearHomePress();if(editDrag)finishHomeDrag();},{capture:true});
document.addEventListener('pointercancel',()=>{clearHomePress();if(editDrag)finishHomeDrag();},{capture:true});
restoreHomeOrder(); build();

</script>
</body>
</html>
