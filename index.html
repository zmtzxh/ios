/* Minimal Dynamic Island: expands horizontally only when tapped */
#dynamic-island{
  position:absolute;
  z-index:85;
  top:calc(max(env(safe-area-inset-top,0px),8px) + var(--island-y, 0px));
  left:calc(50% + var(--island-x, 0px));
  transform:translateX(-50%) scale(var(--island-scale, 1));
  width:126px;
  height:35px;
  box-sizing:border-box;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:999px;
  background:#000;
  border:1px solid #242424;
  color:#fff;
  cursor:pointer;
  transform-origin:center center;
  transition:width .42s cubic-bezier(.22,1,.36,1),transform .42s cubic-bezier(.22,1,.36,1);
}
#dynamic-island.island-open{
  width:244px;
  transform:translateX(-50%) scale(var(--island-scale, 1));
}
#dynamic-island.island-hidden{display:none!important}
#dynamic-island .island-info{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
  width:100%;
  padding:0 13px;
  box-sizing:border-box;
  white-space:nowrap;
  opacity:0;
  transform:translateX(-5px);
  transition:opacity .2s ease .08s,transform .32s ease;
  font-size:11px;
  font-weight:600;
  letter-spacing:.1px;
}
#dynamic-island.island-open .island-info{opacity:1;transform:translateX(0)}
#dynamic-island .island-info span+span{color:#b8b8b8}
@media(prefers-reduced-motion:reduce){#dynamic-island,#dynamic-island .island-info{transition:none}}

.sf-form{flex:1;min-width:0}
.sf-form input{width:100%;border:0;background:none;outline:none;color:var(--tx);font:16px var(--font);text-align:center;padding:0;height:42px}
.typing .sf-form input{text-align:left}
.sf-rl{border:0;background:none;color:var(--tx);width:42px;height:100%;display:grid;place-items:center}
.sf-rl svg{width:19px;height:19px}.sf-rl:disabled{opacity:.3}
.sf-tools{display:flex;justify-content:space-around;margin-top:6px}
.sf-tools button{border:0;background:none;color:var(--blue);width:56px;height:36px;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.sf-tools button svg{width:23px;height:23px}
.sf-tools button:disabled{color:var(--sec);opacity:.45}
.sf-tools button:not(:disabled):active{opacity:.5}
.sf-menu{position:fixed;left:12px;bottom:calc(max(var(--safe-b)*.55,10px) + 112px);z-index:6;min-width:200px;border-radius:14px;background:var(--cell);background:color-mix(in srgb,var(--cell) 86%,transparent);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:0 10px 40px -8px rgba(0,0,0,.4);overflow:hidden}
.sf-menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);font:16px var(--font);padding:13px 16px;border-top:.5px solid var(--sep)}
.sf-menu button:first-child{border-top:0}
.sf-toast{position:fixed;left:50%;bottom:calc(max(var(--safe-b)*.55,10px) + 120px);transform:translateX(-50%);z-index:7;padding:9px 16px;border-radius:20px;background:rgba(30,30,34,.85);color:#fff;font:600 13px var(--font);pointer-events:none}
.sf-toast.on{animation:sf-toast .24s ease-out}
@keyframes sf-toast{from{opacity:0;transform:translate(-50%,8px)}}
/* iOS-style app launch: instant press feedback, springy zoom, blurred Home Screen */
#home{transition:transform .5s cubic-bezier(.17,.9,.22,1),opacity .3s ease,filter .42s ease}
#home.away{transform:scale(1.16);opacity:0;filter:blur(8px);pointer-events:none}
#home:not(.editing) .app:active .ic{transform:scale(.88);transition:transform .09s ease-out}
.app.launching .ic{animation:ios-launch-pop .46s cubic-bezier(.2,.9,.25,1)}
@keyframes ios-launch-pop{0%{transform:scale(.88)}42%{transform:scale(1.12)}100%{transform:scale(1)}}
.app.physics-active{touch-action:none}
.app.physics-held{z-index:60;filter:drop-shadow(0 16px 18px rgba(0,0,0,.4))}

#home{transition:transform calc(.5s*var(--lsx,1)) cubic-bezier(.17,.9,.22,1),opacity calc(.3s*var(--lsx,1)) ease,filter calc(.42s*var(--lsx,1)) ease}
#appc{transition:opacity calc(.22s*var(--lsx,1))}
#appc.on{transition:opacity calc(.22s*var(--lsx,1)) calc(.08s*var(--lsx,1))}
#fxc{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;transition:opacity .4s ease}
body.inapp.fx-apps #fxc{z-index:24}
body:not(.fx-apps).inapp #fxc{opacity:0}
/* GIFOverlay: local animated image above Home Screen and app content. */
#gif-tweak-layer{position:absolute;inset:0;z-index:26;pointer-events:none;overflow:hidden}
.gif-tweak-image{position:absolute;display:none;height:auto;max-width:none;max-height:none;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-drag:none;cursor:grab;transform:translate(-50%,-50%);filter:drop-shadow(0 5px 12px rgba(0,0,0,.24))}
.gif-tweak-image.dragging{cursor:grabbing;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3))}
.ifx-ghost{position:absolute!important;margin:0!important;z-index:30;pointer-events:none;animation-fill-mode:forwards;animation-timing-function:cubic-bezier(.2,.8,.25,1);transform-origin:50% 50%}
#home .app .ic.ifx-source-hidden{visibility:hidden!important;opacity:0!important;pointer-events:none!important}
.ifx-pop{animation-name:ifx-pop}
@keyframes ifx-pop{0%{transform:scale(1)}28%{transform:scale(1.32)}100%{transform:scale(2.6);opacity:0}}
.ifx-spin{animation-name:ifx-spin}
@keyframes ifx-spin{0%{transform:rotate(0) scale(1)}55%{transform:rotate(360deg) scale(1.28)}100%{transform:rotate(560deg) scale(.15);opacity:0}}
.ifx-jelly{animation-name:ifx-jelly}
@keyframes ifx-jelly{0%{transform:scale(1,1)}16%{transform:scale(1.34,.68)}32%{transform:scale(.8,1.28)}48%{transform:scale(1.18,.88)}64%{transform:scale(.95,1.06)}100%{transform:scale(2.2);opacity:0}}
.ifx-shake{animation-name:ifx-shake}
@keyframes ifx-shake{0%{transform:translateX(0) rotate(0)}10%{transform:translateX(-9px) rotate(-10deg)}20%{transform:translateX(9px) rotate(10deg)}30%{transform:translateX(-8px) rotate(-8deg)}40%{transform:translateX(8px) rotate(8deg)}50%{transform:translateX(-5px) rotate(-5deg)}62%{transform:translateX(0) rotate(0) scale(1.15)}100%{transform:scale(2.4);opacity:0}}
.ifx-flip{animation-name:ifx-flip}
@keyframes ifx-flip{0%{transform:perspective(520px) rotateY(0) scale(1)}60%{transform:perspective(520px) rotateY(540deg) scale(1.25)}100%{transform:perspective(520px) rotateY(720deg) scale(2.2);opacity:0}}
.ifx-ripple{animation-name:ifx-ripple}
@keyframes ifx-ripple{0%{transform:scale(1)}30%{transform:scale(1.14)}100%{transform:scale(1.7);opacity:0}}
.ifx-ring{position:absolute;z-index:29;pointer-events:none;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 12px rgba(255,255,255,.5);animation-name:ifx-ring;animation-timing-function:cubic-bezier(.2,.7,.3,1);animation-fill-mode:both;opacity:0}
@keyframes ifx-ring{0%{opacity:.9;transform:translate(-50%,-50%) scale(.9)}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}
.ifx-sparkle{animation-name:ifx-sparkle}
@keyframes ifx-sparkle{0%{transform:scale(1)}30%{transform:scale(1.2)}100%{transform:scale(1.9);opacity:0}}
.ifx-spark{position:absolute;z-index:31;pointer-events:none;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;box-shadow:0 0 8px rgba(255,255,255,.8);animation-name:ifx-spark;animation-timing-function:cubic-bezier(.15,.7,.3,1);animation-fill-mode:both}
@keyframes ifx-spark{0%{transform:translate(0,0) scale(1.1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.ifx-rocket{animation-name:ifx-rocket}
@keyframes ifx-rocket{0%{transform:translateY(0) scale(1) rotate(0)}18%{transform:translateY(8px) scale(.9) rotate(0)}100%{transform:translateY(-110vh) scale(.5) rotate(-12deg);opacity:.2}}
/* SwipeFX: live icon transforms driven by horizontal page-swipe progress. */
@keyframes swipefx-rotate{0%{transform:rotate(0) scale(1)}45%{transform:rotate(190deg) scale(1.12)}100%{transform:rotate(360deg) scale(1)}}
@keyframes swipefx-jump{0%{transform:translateY(0) scale(1)}38%{transform:translateY(-19px) scale(1.08)}68%{transform:translateY(2px) scale(.98)}100%{transform:translateY(0) scale(1)}}
</style>
</head>

        const ifs = settings.querySelector('#ifx-style'); if (ifs) ifs.addEventListener('change', () => api.setIconFx(ifs.value));
        const sbStyle = settings.querySelector('#sb-style'); if (sbStyle) { sbStyle.value = api.tweaks.sbStyle || 'normal'; sbStyle.addEventListener('change', () => api.setSnowBoardStyle(sbStyle.value)); }

        const ifp = settings.querySelector('#ifx-preview'); if (ifp) ifp.addEventListener('click', () => previewIconFx());

        <div class='group'><div class='row'><span>Status</span><b id='jst'></b></div><div class='row'><span>Packages</span><b id='jpk'></b></div></div>

      const $$ = x => el.querySelector(x), rows = [...el.querySelectorAll('.stp')], bar = $$('#jbar'), jw = $$('#jw');
      const status = () => { const d = api.jb.done; $$('#jst').textContent = d ? 'Environment Ready' : 'Not Set Up'; $$('#jpk').textContent = d ? 'Sileo, NewTerm, Tweak Manager' : 'None'; };
      const trollChoice = $$('#trollklip-choice');
      try { trollChoice.checked = localStorage.getItem('ije.installTrollKlip') === '1' || api.jb.inst.includes('trollklip'); } catch (_) {}
      trollChoice.addEventListener('change', () => { try { localStorage.setItem('ije.installTrollKlip', trollChoice.checked ? '1' : '0'); } catch (_) {} if (api.jb.done) { if (trollChoice.checked) installTrollKlip(); else removeTrollKlip(); status(); } });
      const finish = () => { jw.innerHTML = `<div class='jdone'><svg viewBox='0 0 52 52'><circle cx='26' cy='26' r='25' fill='#34c759'/><path class='tick' d='M14 27l8 8 16-17' fill='none' stroke='#fff' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/></svg><b>Jailbroken</b><small>Sileo, NewTerm and Tweak Manager${api.jb.inst.includes('trollklip') ? ', plus TrollKlip' : ''} are on your Home Screen.</small></div>`; status(); };

      else {

          for (let i = 0; i < rows.length; i++) {
            rows[i].className = 'row stp run'; bar.style.width = ((i + .5) / rows.length * 100) + '%';
            await new Promise(r => setTimeout(r, 700 + Math.random() * 500)); rows[i].className = 'row stp ok';
          }
          bar.style.width = '100%'; $$('#jic').classList.remove('run'); api.runJailbreak(); finish();
        };

      const info = this.deviceInfo(); info.querySelector('.hero').remove(); el.append(info);

    deviceInfo() {
      const ua = navigator.userAgent, m = ua.match(/OS (\d+)[_.](\d+)(?:[_.](\d+))?/), sf = ua.match(/Version\/([\d.]+)/);
      const dev = /iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ? 'iPad' : /iPhone/.test(ua) ? 'iPhone' : 'Unknown';
      const g = [
        ['Device', [['Type', dev], ['Platform', navigator.platform || 'Unknown'], ['CPU Threads', navigator.hardwareConcurrency || 'Unknown'], ['Touch Points', navigator.maxTouchPoints || 0]]],

    }

    const descriptions = { zeptagonreborn:'Double-tap Home Screen to summon and dismiss a black hole.', scrollanim:'Choose live scroll effects for app pages.', motionicons:'Tilt and shake controls for colliding Home Screen icons.', appbounce:'Springy icon launch animation.', dockglass:'Choose Liquid, Crystal Clear or Frosted dock glass.', iconlabels:'Show or hide Home Screen labels.', wallpaperdim:'Adjust wallpaper darkness.', iconscale:'Resize Home Screen and dock icons up to 175%.', compactgrid:'Reduce vertical spacing between icon rows.', tapfeedback:'Add a visual response when tapping icons.', launchblur:'Blur and dim wallpaper behind open apps.', dockbounce:'Bounce dock icons when launched.', launchstyle:'Custom open and close animations with a 0.1x to 2x speed slider.', iconrows:'Choose 3 to 6 icons per Home Screen row.', weatherfx:'Snow, rain and thunderstorms over the Home Screen and apps.', iconfx:'Custom icon animations when opening apps, with an independent preview.', snowboard:'Change the roundness of every app icon and apply Normal, Black or White icon artwork across Home Screen, dock and App Library.', swipefx:'Animate icons continuously while swiping between Home Screen pages and App Library: Off, Rotate, Jump, Random or Chaos.', giffx:'Show multiple GIFs or images at once. Drag each item, change its size and control how quickly it bounces off the screen edges.', dynamicisland:'Adjust the Dynamic Island horizontal and vertical position, overall scale, or hide it completely.' };

      const installed = api.jb.inst;
      const rows = TWEAK_PACKAGE_IDS.map(id => `<div class="row" style="gap:10px"><div style="flex:1;min-width:0"><b>${names[id]}</b><div style="font-size:12px;color:var(--sec);margin-top:3px;line-height:1.35">${descriptions[id]}</div></div><button class="gbtn ${installed.includes(id)?'rm':''}" data-package="${id}">${installed.includes(id)?'Remove':'Install'}</button></div>`).join('');

      el.innerHTML = `<div class="hero"><div class="ic" style="background:${this.icon.bg};width:62px;height:62px;margin:0 auto 12px">${this.icon.svg}</div><h1>Tweak Manager</h1><p>Manage your Sileo tweaks in one place</p></div><div class="gh">Installed tweak settings</div><div class="group">${controls || '<div class="row"><span>No tweak settings yet. Install tweaks below.</span></div>'}</div><div class="gf">Install or remove tweaks below. Settings appear here when a tweak is installed. Changes apply immediately.</div><div class="gh">Sileo tweaks · ${TWEAK_PACKAGE_IDS.filter(id=>installed.includes(id)).length}/${TWEAK_PACKAGE_IDS.length} installed</div><div class="group">${rows}</div>`;
      const sc=el.querySelector('#tm-scroll'); if(sc) sc.value=api.tweaks.scrollStyle||'ios';
      const dk=el.querySelector('#tm-dock'); if(dk) dk.value=api.tweaks.dockStyle||'liquid';
      const rr=el.querySelector('#tm-rows'); if(rr) rr.value=String(api.tweaks.iconRows||4);
      const sb=el.querySelector('[data-setting="sbstyle"]'); if(sb) sb.value=api.tweaks.sbStyle||'normal';
      const sw=el.querySelector('[data-setting="swipefx"]'); if(sw) sw.value=api.tweaks.swipeFxMode||'off';
      const gifStatus=el.querySelector('[data-gif-status]'); if(gifStatus) getStoredGif().then(blob=>{gifStatus.textContent=blob?'Image ready':'No image selected';}).catch(()=>{gifStatus.textContent='Session storage';});
    };
    draw();
    el.addEventListener('click', async ev => {
      const pkg=ev.target.closest('button[data-package]');
      if(pkg){
        ev.preventDefault();
        const id=pkg.dataset.package;
        if(api.jb.inst.includes(id)) api.jb.inst=api.jb.inst.filter(x=>x!==id);
        else api.jb.inst.push(id);
        api.saveJB(); syncInstalledTweaks(); draw(); return;
      }
      // Only action buttons should trigger a redraw. Checkbox clicks must be left
      // alone until their change event fires, otherwise the input is replaced
      // before the browser can commit its checked state (the old checkbox bug).
      const action=ev.target.closest('button[data-action]');
      if(!action) return;
      ev.preventDefault();
      if(action.dataset.action==='release'){releaseIconsNow();return;}
      if(action.dataset.action==='lpreview'){previewLaunchStyle();return;}
      if(action.dataset.action==='ipreview'){previewIconFx();return;}
      if(action.dataset.action==='gifpick'){const picker=el.querySelector('#tm-gif-file');if(picker)picker.click();return;}
      if(action.dataset.action==='gifremove'){await clearStoredGif();draw();return;}
      if(action.dataset.action==='islandreset'){Object.assign(TWEAKS,{islandX:0,islandY:0,islandScale:100,islandHidden:false});saveTweaks();applyDynamicIsland();draw();return;}
      if(action.dataset.action==='motion') await api.enableMotion();
      else if(action.dataset.action==='zeptagon') api.setZeptagonEnabled(!api.tweaks.zeptagonEnabled);
      else if(action.dataset.action==='bounce') api.setAppBounce(!api.tweaks.appBounceEnabled);
      else return;
      draw();
    });
    el.addEventListener('change', ev=>{const t=ev.target;if(t.dataset.setting==='scroll')api.setScrollStyle(t.value);else if(t.dataset.setting==='dock')api.setDockStyle(t.value);else if(t.dataset.setting==='rows')api.setIconRows(Number(t.value));else if(t.dataset.action==='labels')api.setLabelsHidden(t.checked);else if(t.dataset.action==='compact')api.setCompactGrid(t.checked);else if(t.dataset.action==='tap')api.setTapFeedback(t.checked);else if(t.dataset.action==='blur')api.setLaunchBlur(t.checked);else if(t.dataset.action==='dockbounce')api.setDockBounce(t.checked);else if(t.dataset.setting==='lstyle')api.setLaunchStyle(t.value);else if(t.dataset.setting==='lspeed')api.setLaunchSpeed(t.value);else if(t.dataset.setting==='fxmode')api.setFxMode(t.value);else if(t.dataset.action==='fxapps')api.setFxApps(t.checked);else if(t.dataset.action==='gifenabled')setGifEnabled(t.checked);else if(t.dataset.action==='gifbounce')setGifBounce(t.checked);else if(t.dataset.action==='islandhide'){TWEAKS.islandHidden=t.checked;saveTweaks();applyDynamicIsland();}else if(t.dataset.setting==='ifx')api.setIconFx(t.value);else if(t.dataset.setting==='sbstyle')api.setSnowBoardStyle(t.value);else if(t.dataset.setting==='swipefx')api.setSwipeFxMode(t.value);});
    el.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.setting==='scale'){api.setIconScale(Number(t.value));const v=el.querySelector('#tm-scale-value');if(v)v.textContent=t.value+'%';}else if(t.dataset.setting==='dim'){api.setWallpaperDim(Number(t.value));const v=el.querySelector('#tm-dim-value');if(v)v.textContent=t.value+'%';}else if(t.dataset.setting==='sbradius'){api.setSnowBoardRadius(t.value);const v=el.querySelector('[data-sbrval]');if(v)v.textContent=t.value+'%';}else if(t.dataset.setting==='gifsize'){setGifSize(t.value);const v=el.querySelector('[data-gif-size-value]');if(v)v.textContent=t.value+' px';}else if(t.dataset.setting==='gifsize'){setGifSize(t.value);const v=el.querySelector('[data-gif-size-value]');if(v)v.textContent=t.value+' px';}else if(t.dataset.setting==='gifspeed'){TWEAKS.gifSpeed=Number(t.value);saveTweaks();const v=el.querySelector('[data-gif-speed-value]');if(v)v.textContent=Number(t.value).toFixed(1)+'x';}else if(t.dataset.setting==='islandx'){TWEAKS.islandX=Number(t.value);saveTweaks();applyDynamicIsland();const v=el.querySelector('[data-island-xv]');if(v)v.textContent=t.value+'px';}else if(t.dataset.setting==='islandy'){TWEAKS.islandY=Number(t.value);saveTweaks();applyDynamicIsland();const v=el.querySelector('[data-island-yv]');if(v)v.textContent=t.value+'px';}else if(t.dataset.setting==='islandscale'){TWEAKS.islandScale=Number(t.value);saveTweaks();applyDynamicIsland();const v=el.querySelector('[data-island-sv]');if(v)v.textContent=t.value+'%';}});
    el.addEventListener('change',async ev=>{const t=ev.target;if(t.id==='tm-gif-file'){const files=Array.from(t.files||[]);if(files.length){const status=el.querySelector('[data-gif-status]');if(status)status.textContent='Adding '+files.length+'…';try{await storeGifFiles(files);if(status)status.textContent=(TWEAKS.gifItems||[]).length+' overlays';setGifEnabled(true);draw();}catch(err){if(status)status.textContent=err.message||'Could not add images';}t.value='';}}});
    return el;
  }
};

/* ============ HELPERS ============ */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const byId = id => APPS.find(a => a.id === id);
const wall = $('#wall'), home = $('#home'), pager = $('#pager'), track = $('#track'),
      dock = $('#dock'), dots = $('#dots'), view = $('#appview'), appc = $('#appc'),
      ascroll = $('#ascroll'), nav = $('.nav'), hi = $('#hi'), splash = $('#splash');

/* ============ GIFOVERLAY: MULTIPLE INDEPENDENT OVERLAYS ============ */
let gifLayer=null,gifBounceFrame=0,gifLastFrame=0,gifDrag=null,gifDbPromise=null,gifStorageMode='session',gifOverlays=[];
const GIF_LOCAL_KEY='ije.gifoverlay.data';
function openGifDB(){if(gifDbPromise)return gifDbPromise;gifDbPromise=new Promise(resolve=>{if(!window.indexedDB){resolve(null);return;}let req;try{req=window.indexedDB.open('ije.gifoverlay',1);}catch(_){resolve(null);return;}req.onupgradeneeded=()=>{try{if(!req.result.objectStoreNames.contains('assets'))req.result.createObjectStore('assets');}catch(_){}};req.onsuccess=()=>{const db=req.result;db.onversionchange=()=>db.close();resolve(db);};req.onerror=()=>resolve(null);req.onblocked=()=>resolve(null);});return gifDbPromise;}
function dataUrlToBlob(data){try{const parts=data.split(',');const mime=(parts[0].match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const raw=atob(parts[1]||'');const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type:mime});}catch(_){return null;}}
function saveGifMeta(){TWEAKS.gifItems=gifOverlays.map(o=>({id:o.id,x:o.x,y:o.y,size:o.size,vx:o.vx,vy:o.vy}));saveTweaks();}
function ensureGifOverlay(){if(gifLayer)return;gifLayer=document.createElement('div');gifLayer.id='gif-tweak-layer';$('#screen').append(gifLayer);window.addEventListener('resize',()=>gifOverlays.forEach(positionGifItem));}
function positionGifItem(o){if(!o.el)return;const r=$('#screen').getBoundingClientRect();o.el.style.left=(o.x*r.width)+'px';o.el.style.top=(o.y*r.height)+'px';o.el.style.width=clamp(Number(o.size)||150,40,360)+'px';}
function makeGifOverlay(blob,meta={}){ensureGifOverlay();const id=meta.id||('gif_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7));const el=document.createElement('img');el.className='gif-tweak-image';el.alt='Custom image or animated GIF';el.draggable=false;el.src=URL.createObjectURL(blob);gifLayer.append(el);const o={id,blob,url:el.src,el,x:meta.x??(.25+Math.random()*.5),y:meta.y??(.2+Math.random()*.55),size:meta.size||150,vx:meta.vx||((Math.random()<.5?-1:1)*112),vy:meta.vy||((Math.random()<.5?-1:1)*86)};gifOverlays.push(o);el.addEventListener('pointerdown',e=>{if(!TWEAKS.gifEnabled||!JB.inst.includes('giffx'))return;e.preventDefault();e.stopPropagation();stopGifBounce();el.classList.add('dragging');try{el.setPointerCapture(e.pointerId);}catch(_){}const r=$('#screen').getBoundingClientRect(),ir=el.getBoundingClientRect();gifDrag={id:e.pointerId,item:o,dx:e.clientX-(ir.left+ir.width/2),dy:e.clientY-(ir.top+ir.height/2),rect:r};});el.addEventListener('pointermove',e=>{if(!gifDrag||gifDrag.id!==e.pointerId||gifDrag.item!==o)return;e.preventDefault();const r=gifDrag.rect;o.x=clamp((e.clientX-gifDrag.dx-r.left)/r.width,.03,.97);o.y=clamp((e.clientY-gifDrag.dy-r.top)/r.height,.04,.96);positionGifItem(o);});const finish=e=>{if(!gifDrag||gifDrag.id!==e.pointerId||gifDrag.item!==o)return;gifDrag=null;el.classList.remove('dragging');saveGifMeta();if(TWEAKS.gifBounce)startGifBounce();};el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish);positionGifItem(o);return o;}
async function readGifBlob(id){const db=await openGifDB();if(!db)return null;try{return await new Promise((resolve,reject)=>{const tx=db.transaction('assets','readonly');const req=tx.objectStore('assets').get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});}catch(_){return null;}}
async function writeGifBlob(id,blob){const db=await openGifDB();if(!db)return false;try{await new Promise((resolve,reject)=>{const tx=db.transaction('assets','readwrite');tx.objectStore('assets').put(blob,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});return true;}catch(_){return false;}}
async function storeGifFiles(files){const valid=files.filter(f=>f&&(String(f.type||'').startsWith('image/')||/\.(gif|png|jpe?g|webp|avif|heic|heif|bmp)$/i.test(f.name||'')));if(!valid.length)throw new Error('Choose one or more image files');for(const file of valid){if(file.size>25*1024*1024)throw new Error(file.name+' is over 25 MB');if(!file.size)continue;const blob=file.slice(0,file.size,file.type||'application/octet-stream');const id='gif_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);const meta={id,x:.25+Math.random()*.5,y:.2+Math.random()*.55,size:150,vx:(Math.random()<.5?-1:1)*112,vy:(Math.random()<.5?-1:1)*86};const stored=await writeGifBlob(id,blob);if(!stored)gifStorageMode='session';else gifStorageMode='device';makeGifOverlay(blob,meta);}saveGifMeta();applyGifOverlay();}
async function loadGifOverlay(){ensureGifOverlay();for(const o of gifOverlays){try{URL.revokeObjectURL(o.url);}catch(_){}o.el.remove();}gifOverlays=[];const metas=Array.isArray(TWEAKS.gifItems)?TWEAKS.gifItems:[];for(const meta of metas){const blob=await readGifBlob(meta.id);if(blob)makeGifOverlay(blob,meta);}if(!gifOverlays.length){/* Backward compatibility with the previous single-image version. */let legacy=null;const db=await openGifDB();if(db){try{legacy=await new Promise(resolve=>{const tx=db.transaction('assets','readonly'),q=tx.objectStore('assets').get('main');q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>resolve(null);});}catch(_){}}if(!legacy){try{const data=localStorage.getItem(GIF_LOCAL_KEY);if(data)legacy=dataUrlToBlob(data);}catch(_){}}if(legacy){makeGifOverlay(legacy,{id:'gif_legacy',x:TWEAKS.gifX||.68,y:TWEAKS.gifY||.32,size:TWEAKS.gifSize||150,vx:112,vy:86});saveGifMeta();}}applyGifOverlay();return gifOverlays.length>0;}
async function clearStoredGif(){stopGifBounce();for(const o of gifOverlays){try{URL.revokeObjectURL(o.url);}catch(_){}o.el.remove();}gifOverlays=[];const db=await openGifDB();if(db){try{await new Promise(resolve=>{const tx=db.transaction('assets','readwrite'),store=tx.objectStore('assets');for(const o of TWEAKS.gifItems||[])store.delete(o.id);store.delete('main');tx.oncomplete=resolve;tx.onerror=resolve;tx.onabort=resolve;});}catch(_){}}try{localStorage.removeItem(GIF_LOCAL_KEY);}catch(_){}TWEAKS.gifItems=[];TWEAKS.gifEnabled=false;TWEAKS.gifBounce=false;saveTweaks();}
function setGifEnabled(v){TWEAKS.gifEnabled=!!v;saveTweaks();applyGifOverlay();}
function setGifSize(v){TWEAKS.gifSize=clamp(Number(v)||150,50,320);gifOverlays.forEach(o=>{o.size=TWEAKS.gifSize;positionGifItem(o);});saveGifMeta();}
function setGifBounce(v){TWEAKS.gifBounce=!!v;saveTweaks();if(TWEAKS.gifBounce)startGifBounce();else stopGifBounce();}
function applyGifOverlay(){ensureGifOverlay();const active=JB.inst.includes('giffx')&&TWEAKS.gifEnabled;gifOverlays.forEach(o=>{o.el.style.display=active?'block':'none';positionGifItem(o);});if(active&&TWEAKS.gifBounce)startGifBounce();else stopGifBounce();}
function startGifBounce(){if(gifBounceFrame||!gifOverlays.length||gifDrag)return;gifLastFrame=0;const frame=now=>{gifBounceFrame=0;if(!TWEAKS.gifBounce||!TWEAKS.gifEnabled||!JB.inst.includes('giffx')||gifDrag)return;const dt=Math.min(.04,(now-(gifLastFrame||now))/1000)*(Number(TWEAKS.gifSpeed)||1);gifLastFrame=now;const sr=$('#screen').getBoundingClientRect();for(const o of gifOverlays){if(o.el.style.display==='none')continue;const ir=o.el.getBoundingClientRect();let cx=o.x*sr.width,cy=o.y*sr.height;const hw=ir.width/2,hh=ir.height/2,minX=hw+4,maxX=Math.max(hw+4,sr.width-hw-4),minY=hh+8,maxY=Math.max(hh+8,sr.height-hh-8);cx+=o.vx*dt;cy+=o.vy*dt;if(cx<minX){cx=minX;o.vx=Math.abs(o.vx);}else if(cx>maxX){cx=maxX;o.vx=-Math.abs(o.vx);}if(cy<minY){cy=minY;o.vy=Math.abs(o.vy);}else if(cy>maxY){cy=maxY;o.vy=-Math.abs(o.vy);}o.x=cx/sr.width;o.y=cy/sr.height;positionGifItem(o);}gifBounceFrame=requestAnimationFrame(frame);};gifBounceFrame=requestAnimationFrame(frame);}
function stopGifBounce(){if(gifBounceFrame)cancelAnimationFrame(gifBounceFrame);gifBounceFrame=0;gifLastFrame=0;}

function iconNode(app) {
  const d = document.createElement('div');
  d.className = 'ic'; d.style.background = app.icon.bg; d.innerHTML = app.icon.svg; return d;
}
function appNode(app, label = true) {
  const a = document.createElement('div'); a.className = 'app'; a.dataset.id = app.id;
  a.append(iconNode(app));
  if (label) { const s = document.createElement('span'); s.textContent = app.name; a.append(s); }
  return a;
}

      e.innerHTML=`<div class="hero"><h1>Calculator</h1><p>A pocket calculator</p></div><div style="margin:0 18px 14px;padding:18px 16px;border-radius:18px;background:var(--cell);box-shadow:0 1px 5px #0001;text-align:right"><div id="calc-history" style="min-height:18px;color:var(--sec);font-size:13px;word-break:break-all"></div><div id="calc-display" style="font-size:38px;font-weight:300;min-height:48px;overflow-wrap:anywhere">0</div></div><div id="calc-keys" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 18px 18px">${['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(k=>`<button data-key="${k}" style="border:0;border-radius:16px;min-height:58px;background:${['÷','×','−','+','='].includes(k)?'#ff9f0a':['AC','±','%','⌫'].includes(k)?'var(--lz)':'var(--cell)'};color:${['÷','×','−','+','='].includes(k)?'#fff':'var(--tx)'};font:600 23px var(--font)">${k}</button>`).join('')}</div><div class="gf">Calculations run locally on this device.</div>`;
      let expr='', fresh=false; const display=e.querySelector('#calc-display'), history=e.querySelector('#calc-history');

    content() {
      const e=document.createElement('div');e.innerHTML=`<div class="hero"><h1>Clock</h1><p>Make a little progress, then take a break.</p></div><div style="margin:0 18px 16px;padding:25px 18px;border-radius:24px;background:var(--cell);text-align:center"><div id="timer-mode" style="color:var(--sec);font-weight:600">FOCUS</div><div id="timer-readout" style="font-size:64px;letter-spacing:-2px;font-weight:200;font-variant-numeric:tabular-nums;margin:8px 0">25:00</div><div style="display:flex;justify-content:center;gap:10px"><button id="timer-start" class="gbtn">Start</button><button id="timer-reset" class="gbtn rm">Reset</button></div></div><div class="group"><div class="row"><span>Session length</span><select id="timer-length" style="border:0;background:transparent;color:var(--blue);font:16px var(--font)"><option value="1500">25 minutes</option><option value="900">15 minutes</option><option value="3000">50 minutes</option></select></div><div class="row"><span>Switch to</span><button id="timer-break" class="gbtn">5 min break</button></div></div><div class="gf">The timer keeps counting while this app is open. Finishing a session gives you a little celebration.</div>`;
      let total=1500,remaining=total,deadline=0,interval=null,running=false,mode='FOCUS';const read=e.querySelector('#timer-readout'),start=e.querySelector('#timer-start'),modeEl=e.querySelector('#timer-mode');
      const paint=()=>{read.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');start.textContent=running?'Pause':'Start';modeEl.textContent=mode;};
      const stop=()=>{if(interval)clearInterval(interval);interval=null;running=false;};
      const tick=()=>{remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!remaining){stop();read.textContent='00:00';start.textContent='Start';modeEl.textContent=mode+' COMPLETE 🎉';if(navigator.vibrate)navigator.vibrate([100,60,100]);return;}paint();};
      start.addEventListener('click',()=>{if(running){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));stop();paint();}else{running=true;deadline=Date.now()+remaining*1000;paint();interval=setInterval(tick,250);}});
      e.querySelector('#timer-reset').addEventListener('click',()=>{stop();remaining=total;paint();});
      e.querySelector('#timer-length').addEventListener('change',ev=>{stop();mode='FOCUS';total=Number(ev.target.value);remaining=total;paint();});
      e.querySelector('#timer-break').addEventListener('click',()=>{stop();mode='BREAK';total=300;remaining=total;paint();});
      paint();return e;
    }
  },

    content() { const e=document.createElement('div');e.innerHTML=`<div class="hero"><h1>Notes</h1><p>Your thoughts, saved automatically.</p></div><div class="group" style="margin:0 16px"><textarea id="pocket-note" placeholder="Write a note…" style="width:100%;min-height:220px;padding:16px;border:0;outline:0;background:transparent;color:var(--tx);font:16px/1.5 var(--font);resize:vertical;-webkit-user-select:text;user-select:text"></textarea></div><div class="row" style="margin:10px 16px"><span id="note-status" style="color:var(--sec);font-size:13px">Saved on this device</span><button id="note-clear" class="gbtn rm">Clear</button></div><div class="gf">Your note is saved automatically and stays here when you reopen the app.</div>`;const t=e.querySelector('#pocket-note'),status=e.querySelector('#note-status');try{t.value=localStorage.getItem('ije.pocketNotes')||'';}catch(_){}let save; t.addEventListener('input',()=>{status.textContent='Saving…';clearTimeout(save);save=setTimeout(()=>{try{localStorage.setItem('ije.pocketNotes',t.value);status.textContent='Saved';}catch(_){status.textContent='Could not save';}},180);});e.querySelector('#note-clear').addEventListener('click',()=>{t.value='';try{localStorage.removeItem('ije.pocketNotes');}catch(_){}status.textContent='Note cleared';});return e; }

    id: 'app.tictactoe', name: 'Tic Tac Toe', category: 'Games',
    icon: { bg: 'linear-gradient(145deg,#43c6ac,#237a9b)', svg: '<svg viewBox="0 0 60 60"><path d="M22 10v40M38 10v40M10 22h40M10 38h40" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M14 14l8 8m0-8-8 8M38 38l8 8m0-8-8 8" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>' },
    content() {
      const e=document.createElement('div');e.innerHTML=`<div class="hero"><h1>Tic Tac Toe</h1><p>Play against a friend on the same device.</p></div><div id="ttt-status" style="text-align:center;font-weight:700;margin:10px">X's turn</div><div id="ttt-board" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:12px auto">${Array.from({length:9},(_,i)=>`<button data-cell="${i}" style="aspect-ratio:1;border:0;border-radius:18px;background:var(--cell);font-size:42px;font-weight:700;color:var(--tx)"></button>`).join('')}</div><div style="text-align:center"><button id="ttt-reset" class="gbtn">New game</button></div><div class="gf">Get three Xs or Os in a row to win.</div>`;
      let board=Array(9).fill(''),turn='X',done=false;const status=e.querySelector('#ttt-status');const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      const paint=()=>{e.querySelectorAll('[data-cell]').forEach((b,i)=>{b.textContent=board[i];b.disabled=!!board[i]||done;});const w=wins.find(line=>line.every(i=>board[i]&&board[i]===board[line[0]]));if(w){done=true;status.textContent=board[w[0]]+' wins! 🎉';}else if(board.every(Boolean)){done=true;status.textContent='It is a draw!';}else status.textContent=turn+"'s turn";};
      e.querySelector('#ttt-board').addEventListener('click',ev=>{const b=ev.target.closest('[data-cell]');if(!b||done||board[Number(b.dataset.cell)])return;board[Number(b.dataset.cell)]=turn;turn=turn==='X'?'O':'X';paint();});e.querySelector('#ttt-reset').addEventListener('click',()=>{board=Array(9).fill('');turn='X';done=false;paint();});paint();return e;
    }
  },
  {
    id: 'app.memorymatch', name: 'Memory Match', category: 'Games',
    icon: { bg: 'linear-gradient(145deg,#f6a6d7,#8b5cf6)', svg: '<svg viewBox="0 0 60 60"><rect x="10" y="12" width="25" height="34" rx="5" fill="#fff"/><rect x="25" y="16" width="25" height="34" rx="5" fill="#ffe5f3" stroke="#fff" stroke-width="3"/><path d="M32 28l5 5 7-9" fill="none" stroke="#a855a0" stroke-width="3" stroke-linecap="round"/></svg>' },
    content() {
      const e=document.createElement('div');e.innerHTML=`<div class="hero"><h1>Memory Match</h1><p>Find all four matching pairs.</p></div><div id="mem-info" style="text-align:center;margin:8px;font-weight:600">Moves: 0</div><div id="mem-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:0 18px">${Array.from({length:8},(_,i)=>`<button data-card="${i}" style="aspect-ratio:1;border:0;border-radius:15px;background:var(--cell);font-size:30px">?</button>`).join('')}</div><div style="text-align:center;margin:16px"><button id="mem-reset" class="gbtn">Shuffle & restart</button></div><div class="gf">Match the pairs: 🍎 🚀 🐱 ⭐</div>`;
      const symbols=['🍎','🚀','🐱','⭐'];let deck=[],open=[],matched=new Set(),moves=0,locked=false;const grid=e.querySelector('#mem-grid'),info=e.querySelector('#mem-info');
      const start=()=>{deck=[...symbols,...symbols].sort(()=>Math.random()-.5);open=[];matched=new Set();moves=0;locked=false;info.textContent='Moves: 0';grid.querySelectorAll('button').forEach((b,i)=>{b.textContent='?';b.disabled=false;b.style.background='var(--cell)';b.dataset.value=deck[i];});};
      grid.addEventListener('click',ev=>{const b=ev.target.closest('[data-card]');if(!b||locked||matched.has(Number(b.dataset.card))||open.includes(Number(b.dataset.card)))return;const i=Number(b.dataset.card);b.textContent=deck[i];open.push(i);if(open.length===2){moves++;info.textContent='Moves: '+moves;if(deck[open[0]]===deck[open[1]]){open.forEach(n=>{matched.add(n);grid.querySelector(`[data-card="${n}"]`).style.background='#34c75933';});open=[];if(matched.size===8)info.textContent='Completed in '+moves+' moves! 🎉';}else{locked=true;const pair=[...open];setTimeout(()=>{pair.forEach(n=>grid.querySelector(`[data-card="${n}"]`).textContent='?');open=[];locked=false;},650);}}});e.querySelector('#mem-reset').addEventListener('click',start);start();return e;
    }
  },

    id: 'app.dicelab', name: 'Dice Lab', category: 'Games',
    icon: { bg: 'linear-gradient(145deg,#ffbd59,#e66a35)', svg: '<svg viewBox="0 0 60 60"><rect x="10" y="10" width="40" height="40" rx="9" fill="#fff"/><g fill="#e66a35"><circle cx="20" cy="20" r="3.5"/><circle cx="40" cy="20" r="3.5"/><circle cx="30" cy="30" r="3.5"/><circle cx="20" cy="40" r="3.5"/><circle cx="40" cy="40" r="3.5"/></g></svg>' },
    content() {
      const e=document.createElement('div');e.innerHTML=`<div class="hero"><h1>Dice Lab</h1><p>Roll some dice and test your luck.</p></div><div class="group" style="margin:0 16px"><div class="row"><label for="dice-count">Number of dice</label><select id="dice-count" style="border:0;background:transparent;color:var(--blue);font:16px var(--font)"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div></div><div id="dice-results" style="min-height:100px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:20px;font-size:48px">🎲</div><div id="dice-total" style="text-align:center;font-size:22px;font-weight:700;margin:4px">Ready?</div><div style="text-align:center;margin:16px"><button id="dice-roll" class="gbtn">Roll dice</button></div><div class="gf">Every roll is random and happens locally.</div>`;
      const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];e.querySelector('#dice-roll').addEventListener('click',()=>{const n=Number(e.querySelector('#dice-count').value),rolls=Array.from({length:n},()=>1+Math.floor(Math.random()*6));e.querySelector('#dice-results').textContent=rolls.map(x=>faces[x-1]).join(' ');e.querySelector('#dice-total').textContent='Total: '+rolls.reduce((a,b)=>a+b,0);});return e;

    content() {
      const e=document.createElement('div');e.innerHTML=`<div class="hero"><h1>Color Studio</h1><p>Build a color palette and preview it.</p></div><div id="color-preview" style="height:150px;margin:0 18px 16px;border-radius:22px;background:linear-gradient(135deg,#ff6b6b,#f9c74f,#43aa8b);display:grid;place-items:center;color:white;font-size:20px;font-weight:700;text-shadow:0 1px 5px #0005">Your palette</div><div id="color-swatches" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 18px">${['#ff6b6b','#f9c74f','#43aa8b','#577590','#9b5de5','#f15bb5','#00bbf9','#00f5d4'].map(c=>`<button data-color="${c}" aria-label="${c}" style="height:52px;border:0;border-radius:14px;background:${c}"></button>`).join('')}</div><div style="text-align:center;margin:16px"><button id="color-random" class="gbtn">Random palette</button></div><div class="gf">Tap swatches to build your own four-color gradient.</div>`;
      let chosen=['#ff6b6b','#f9c74f','#43aa8b','#577590'];const paint=()=>{e.querySelector('#color-preview').style.background=`linear-gradient(135deg,${chosen.join(',')})`;};e.querySelector('#color-swatches').addEventListener('click',ev=>{const b=ev.target.closest('[data-color]');if(!b)return;chosen.push(b.dataset.color);if(chosen.length>4)chosen.shift();paint();});e.querySelector('#color-random').addEventListener('click',()=>{const all=[...e.querySelectorAll('[data-color]')].map(b=>b.dataset.color);chosen=Array.from({length:4},()=>all[Math.floor(Math.random()*all.length)]);paint();});paint();return e;

    content() {
      const e=document.createElement('div');e.innerHTML=`<div class="hero"><h1>Bulk Installer</h1><p>Set up your tools and utilities in one tap.</p></div><div class="group" style="margin:0 16px"><div class="row"><span>Available tweaks</span><b>${TWEAK_PACKAGE_IDS.length}</b></div><div class="row"><span>Store apps</span><b>${APP_CATALOG.length}</b></div><div class="row"><span>Already installed</span><b id="bulk-count">0</b></div></div><div style="padding:18px;text-align:center"><button id="bulk-install" class="gbtn" style="background:#34c759;color:#fff;padding:13px 22px">Install everything</button></div><div id="bulk-status" class="gf">This installs every catalogued tweak through Sileo and every app in the App Store.</div>`;
      const count=e.querySelector('#bulk-count'),status=e.querySelector('#bulk-status'),btn=e.querySelector('#bulk-install');const refresh=()=>{count.textContent=String(TWEAK_PACKAGE_IDS.filter(x=>JB.inst.includes(x)).length+APP_CATALOG.filter(a=>byId(a.id)).length);};refresh();btn.addEventListener('click',()=>{let added=0;TWEAK_PACKAGE_IDS.forEach(id=>{if(!JB.inst.includes(id)){JB.inst.push(id);added++;}});APP_CATALOG.forEach(a=>{if(!byId(a.id)){APPS.push(a);if(!JB.inst.includes('hexapp:'+a.id))JB.inst.push('hexapp:'+a.id);added++;}});saveJB();refresh();status.textContent=added?`All done! ${added} items installed. Open Sileo or return Home to see your apps.`:'Everything is already installed.';btn.textContent='Install again';build();});return e;
    }
  }
];
function installCatalogApp(id) {
  const app = APP_CATALOG.find(a => a.id === id);
  if (!app || byId(id)) return;
  APPS.push(app); if (!JB.inst.includes('hexapp:' + id)) JB.inst.push('hexapp:' + id);
  saveJB(); build();
}
function uninstallCatalogApp(id) {
  const i=APPS.findIndex(a=>a.id===id);
  if(i>=0) APPS.splice(i,1);
  JB.inst=JB.inst.filter(x=>x!=='hexapp:'+id);
  saveJB(); build();
}

const TROLLKLIP_APP = {
  id:'app.trollklip', name:'TrollKlip', category:'Utilities',

  content() {
    const e=document.createElement('div');

      <div class="gh">Import IPA</div><div class="group" style="padding:16px"><input id="tk-file" type="file" accept=".ipa,application/octet-stream" style="display:none"><button id="tk-pick" class="gbtn" style="width:100%;padding:13px">＋ Select IPA File</button><div id="tk-selected" style="font-size:13px;color:var(--sec);margin-top:12px;text-align:center">No file selected</div><button id="tk-install" class="gbtn" disabled style="width:100%;margin-top:12px;padding:13px;background:#1685ed;color:white">Install</button></div>
      <div class="gh">Installed Apps</div><div class="group" id="tk-installed"></div><div class="gf">Choose an IPA file to add a Home Screen entry using its filename.</div><div id="tk-result-note" class="gf" aria-live="polite"></div><div style="padding:8px 16px 18px"><button id="tk-home" class="gbtn" style="width:100%;padding:12px" hidden>Return to Home Screen</button></div>`;
    const file=e.querySelector('#tk-file'), picked=e.querySelector('#tk-pick'), selected=e.querySelector('#tk-selected'), install=e.querySelector('#tk-install'), list=e.querySelector('#tk-installed');
    let chosen=null;
    const read=()=>{let items=[];try{items=JSON.parse(localStorage.getItem('ije.trollklip.apps')||'[]')}catch(_){};list.innerHTML=items.length?items.map((x,i)=>`<div class="row"><span>${escapeHTML(x.name)}</span><b style="color:#34c759">Installed</b></div>`).join(''):'<div class="row"><span>No apps installed</span></div>';};
    picked.addEventListener('click',()=>file.click());
    file.addEventListener('change',()=>{chosen=file.files&&file.files[0]||null;selected.textContent=chosen?chosen.name:'No file selected';install.disabled=!chosen;});
    install.addEventListener('click',()=>{
      if(!chosen)return;
      const name=chosen.name.replace(/\.ipa$/i,'').trim()||'Untitled App';
      let items=[];
      try{items=JSON.parse(localStorage.getItem('ije.trollklip.apps')||'[]');if(!Array.isArray(items))items=[];}catch(_){items=[];}
      if(!items.some(x=>x&&typeof x.name==='string'&&x.name.toLowerCase()===name.toLowerCase()))items.push({name});
      let saved=false;
      try{localStorage.setItem('ije.trollklip.apps',JSON.stringify(items));saved=true;}catch(_){}
      // Add the shortcut to the live app registry immediately; do not rely only on
      // re-reading storage, which can fail on browsers with restricted storage.
      const shortcut=trollKlipShortcut(name);
      if(!byId(shortcut.id))APPS.push(shortcut);
      syncTrollKlipShortcuts();
      build();
      selected.textContent=name+' added to Home Screen';
      chosen=null;file.value='';install.disabled=true;read();
      const note=e.querySelector('#tk-result-note');
      if(note)note.textContent=saved?'The app icon is now on your Home Screen.':'The icon is available for this session; browser storage is unavailable.';
      const go=e.querySelector('#tk-home');
      if(go){go.hidden=false;go.onclick=()=>closeApp();}
    });
    read();return e;
  }
};

function trollKlipShortcut(name){return {id:'trollklip.ipa.'+encodeURIComponent(name),name,category:'Apps',icon:{bg:'linear-gradient(145deg,#30323a,#111218)',svg:'<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="60" rx="13" fill="#24252b"/><path d="M17 13h17l11 11v23H17z" fill="#f5f5f7"/><path d="M34 13v12h11" fill="none" stroke="#aaa" stroke-width="2"/><text x="30" y="39" text-anchor="middle" font-size="9" font-family="Arial" font-weight="700" fill="#2678e8">IPA</text></svg>'},content(){const e=document.createElement('div');e.innerHTML=`<div style="padding:34px 20px;text-align:center"><div style="font-size:58px">📦</div><h1>${escapeHTML(name)}</h1><p style="color:var(--sec)">Added from TrollKlip</p></div>`;return e;}};}
function syncTrollKlipShortcuts(){let items=[];try{items=JSON.parse(localStorage.getItem('ije.trollklip.apps')||'[]')}catch(_){};for(const x of items){const id='trollklip.ipa.'+encodeURIComponent(x.name);if(!byId(id))APPS.push(trollKlipShortcut(x.name));}}

const WKEY = 'ije.wallpaper';
let defaultWall = '', customWall = null;
function makeDefaultWall() {
  /* Procedural keycap wallpaper: a skewed grid of rounded keys with a few coloured accent keys (fixed 393x852 canvas, scaled with cover). */
  const W = 393, H = 852, k = 2, p = 76;
  const c = document.createElement('canvas'); c.width = W * k; c.height = H * k;
  const x = c.getContext('2d'); x.scale(k, k);
  x.fillStyle = '#5f5f65'; x.fillRect(0, 0, W, H);
  const ux = p * .95, uy = -p * .38, vx = p * .46, vy = p * .8, ox0 = -W * .25, oy0 = H * .08;
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pal = [['#cf6461', '#8f3b3a'], ['#8f6fd0', '#5a3e9e'], ['#4f7cd0', '#30508f'], ['#ead86e', '#a99b3d'], ['#bf7d4e', '#83512e'], ['#607a68', '#3b5043']];
  const rr = (w, h, r) => { x.beginPath(); x.moveTo(r, 0); x.arcTo(w, 0, w, h, r); x.arcTo(w, h, 0, h, r); x.arcTo(0, h, 0, 0, r); x.arcTo(0, 0, w, 0, r); x.closePath(); };
  const T = (ox, oy) => x.setTransform(k * ux, k * uy, k * vx, k * vy, k * ox, k * oy);
  for (let j = -3; j < 17; j++) for (let i = -3; i < 16; i++) {
    const ox = ox0 + i * ux + j * vx, oy = oy0 + i * uy + j * vy;
    if (ox < -p * 2 || ox > W + p || oy < -p * 2 || oy > H + p * 2) continue;
    const wide = rnd() < .1, wu = wide ? 2 : 1;
    const acc = ox > W * .3 && oy > H * .5 && rnd() < .2 ? pal[Math.floor(rnd() * pal.length)] : null;
    const lift = acc ? 6 : 0, d = acc ? 13 : 9, w = wu - .12;
    x.save();
    T(ox + .06 * ux + .06 * vx, oy + d + .06 * uy + .06 * vy); x.shadowColor = 'rgba(0,0,0,.4)'; x.shadowBlur = 14; x.shadowOffsetY = 6;
    x.fillStyle = acc ? acc[1] : '#8e8e94'; rr(w, .88, .17); x.fill(); x.shadowColor = 'transparent';
    T(ox + .06 * ux + .06 * vx, oy - lift + .06 * uy + .06 * vy);
    const g = x.createLinearGradient(0, 0, w * .6, 1); g.addColorStop(0, acc ? acc[0] : '#dcdce0'); g.addColorStop(1, acc ? acc[0] : '#bcbcc2');
    x.fillStyle = g; rr(w, .88, .17); x.fill();
    x.translate(.14, .14); x.fillStyle = 'rgba(0,0,0,.06)'; rr(w - .28, .6, .12); x.fill();
    x.restore();
    if (wide) i++;
  }
  x.setTransform(k, 0, 0, k, 0, 0);
  const v = x.createRadialGradient(W * .5, H * .5, H * .12, W * .5, H * .5, H * .78);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.42)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  return c.toDataURL('image/jpeg', .9);
}

function createSocialDemo(item) {
  const isYT = item.id === 'youtube';
  const e = document.createElement('div');
  e.className = 'social-demo ' + (isYT ? 'social-youtube' : 'social-tiktok');
  const posts = isYT ? [
    {user:'Pixel Planet',title:'A tiny universe in motion ✨',tag:'#animation #space',kind:'SPACE'},
    {user:'Daily Builds',title:'Satisfying neon desk setup',tag:'#setup #creative',kind:'GLOW'},
    {user:'Loop Lab',title:'This loop never gets old',tag:'#loop #visuals',kind:'LOOP'}
  ] : [
    {user:'@pixelplanet',title:'wait for the final effect ✨',tag:'#fyp #animation',kind:'VIBE'},
    {user:'@dailybuilds',title:'purple setup appreciation 💜',tag:'#desksetup',kind:'GLOW'},
    {user:'@looplab',title:'one more time 🔁',tag:'#satisfying',kind:'LOOP'}
  ];
  const seedComments = [
    ['This is so cool 🔥','Need a tutorial!','The colours are amazing 💜'],
    ['clean setup omg','Where did you get the lights?','10/10 vibe'],
    ['I watched this 20 times','smooth loop','more of these please 🙌']
  ];
  const counts = posts.map((_,i)=>Math.floor(1200 + Math.random()*98000 + i*7400));
  const key = 'ije.social.'+item.id;
  let saved={}; try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{};}catch(_){}
  const esc = v => String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  e.innerHTML = `<style>
    .social-demo{font-family:var(--font);min-height:100%;background:var(--bg);color:var(--tx)}
    .sd-top{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .sd-brand{font-size:23px;font-weight:900;letter-spacing:-1px}.sd-pill{border:0;border-radius:20px;padding:8px 13px;background:var(--lz);color:var(--tx);font-weight:700}
    .sd-post{padding:14px 14px 18px;border-bottom:8px solid var(--cell)}.sd-user{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;margin-bottom:10px}.sd-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:white;background:linear-gradient(135deg,#ff4da6,#6546ff);font-weight:900}
    .sd-art{height:230px;border-radius:18px;overflow:hidden;position:relative;display:grid;place-items:center;color:white;background:linear-gradient(135deg,#17133e,#7716a8,#ff3e9e);isolation:isolate}
    .sd-art:before,.sd-art:after{content:'';position:absolute;border-radius:50%;filter:blur(2px);z-index:-1;animation:sd-drift 6s ease-in-out infinite alternate}
    .sd-art:before{width:190px;height:190px;left:-25px;top:20px;background:radial-gradient(circle at 35% 35%,#fff9,#00d9ff 28%,#7b2cff 65%,transparent 72%)}
    .sd-art:after{width:220px;height:220px;right:-45px;bottom:-70px;background:radial-gradient(circle at 35% 35%,#fff9,#ff38bb 25%,#592cff 65%,transparent 72%);animation-delay:-2s}
    .sd-art .sd-word{font-size:36px;font-weight:1000;letter-spacing:4px;text-shadow:0 4px 24px #0008;animation:sd-pop 3.4s ease-in-out infinite}
    .sd-art .sd-orbit{position:absolute;width:145px;height:145px;border:2px solid #ffffff99;border-radius:34%;transform:rotate(35deg);animation:sd-spin 12s linear infinite}
    .sd-art .sd-orbit:nth-child(2){width:100px;height:100px;border-color:#ffffff55;animation-direction:reverse;animation-duration:8s}
    .sd-art .sd-play{position:absolute;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#0005;backdrop-filter:blur(8px);font-size:21px;opacity:.9}
    @keyframes sd-drift{to{transform:translate(24px,-17px) scale(1.12)}}@keyframes sd-pop{50%{transform:scale(1.08) rotate(-2deg)}}@keyframes sd-spin{to{transform:rotate(395deg)}}
    .sd-title{font-size:15px;font-weight:750;line-height:1.35;margin:10px 0 4px}.sd-sub{font-size:12px;color:var(--sec)}.sd-actions{display:flex;gap:9px;align-items:center;margin-top:12px;flex-wrap:wrap}.sd-action{border:0;border-radius:20px;padding:8px 12px;background:var(--cell);color:var(--tx);font-weight:700;font-size:13px}.sd-action.liked{color:#ff3158;background:color-mix(in srgb,#ff3158 13%,var(--cell))}.sd-comments{display:none;padding:10px 0 0}.sd-comments.open{display:block}.sd-comment{font-size:13px;line-height:1.4;padding:7px 0;border-bottom:1px solid var(--line)}.sd-comment b{margin-right:5px}.sd-comment-form{display:flex;gap:7px;margin-top:9px}.sd-comment-form input{min-width:0;flex:1;border:0;border-radius:18px;padding:10px 12px;background:var(--cell);color:var(--tx);font:14px var(--font)}.sd-comment-form button{border:0;border-radius:18px;padding:0 13px;background:#1685ed;color:white;font-weight:700}
    .social-tiktok .sd-post{padding:10px 12px 18px}.social-tiktok .sd-art{height:420px;border-radius:20px}.social-tiktok .sd-art .sd-word{font-size:42px}.sd-tiktok-actions{position:absolute;right:12px;bottom:16px;display:grid;gap:14px;text-align:center}.sd-tiktok-actions button{width:44px;height:44px;border:0;border-radius:50%;background:#0006;color:white;font-size:20px}.sd-tiktok-actions small{display:block;font-size:11px;color:white;text-shadow:0 1px 4px #000}.sd-note{padding:14px 16px;color:var(--sec);font-size:12px;text-align:center}
  </style>
  <div class="sd-top"><div class="sd-brand">${isYT?'▶ YouTube':'♪ TikTok'}</div><button class="sd-pill" data-refresh>↻ Refresh</button></div>
  <div class="sd-feed">${posts.map((post,i)=>{
    const liked=!!(saved.liked&&saved.liked[i]); const likes=(saved.counts&&saved.counts[i])||counts[i];
    const comments=(saved.comments&&saved.comments[i])||seedComments[i];
    return `<article class="sd-post" data-post="${i}"><div class="sd-user"><span class="sd-avatar">${post.user.replace(/[^a-z]/gi,'').slice(0,1).toUpperCase()}</span><span>${post.user}</span><span style="margin-left:auto;color:var(--sec);font-weight:500">${isYT?'•  Suggested':'For You ·'}</span></div>
      <div class="sd-art" role="img" aria-label="Video preview"><span class="sd-orbit"></span><span class="sd-orbit"></span><span class="sd-word">${post.kind}</span><span class="sd-play">▶</span>
      ${!isYT?`<div class="sd-tiktok-actions"><div><button data-like class="${liked?'liked':''}">${liked?'♥':'♡'}</button><small data-count>${likes.toLocaleString()}</small></div><div><button data-comments>☰</button><small>Comments</small></div><div><button data-share>↗</button><small>Share</small></div></div>`:''}</div>
      <div class="sd-title">${post.title}</div><div class="sd-sub">${post.tag} · ${isYT?'Featured channel':'Original sound'}</div>
      ${isYT?`<div class="sd-actions"><button class="sd-action ${liked?'liked':''}" data-like>♥ <span data-count>${likes.toLocaleString()}</span></button><button class="sd-action" data-comments>▤ Comments (${comments.length})</button><button class="sd-action" data-share>↗ Share</button></div>`:''}
      <div class="sd-comments"><b style="font-size:13px">Comments</b><div class="sd-comment-list">${comments.map(c=>`<div class="sd-comment"><b>@${['nova','pixel_fan','mika'][Math.floor(Math.random()*3)]}</b>${esc(c)}</div>`).join('')}</div><form class="sd-comment-form"><input maxlength="120" placeholder="Add a comment…"><button>Post</button></form></div>
    </article>`;
  }).join('')}</div><div class="sd-note">Your likes and comments are saved on this device.</div>`;
  const persist=()=>{try{localStorage.setItem(key,JSON.stringify(saved));}catch(_){}};
  e.addEventListener('click',ev=>{
    if(ev.target.closest('[data-refresh]')){e.querySelectorAll('.sd-art').forEach(a=>{a.style.filter='hue-rotate('+Math.floor(Math.random()*300)+'deg)';a.style.transform='scale(.985)';setTimeout(()=>{if(a.isConnected){a.style.filter='';a.style.transform='';}},260);});return;}
    const post=ev.target.closest('.sd-post'); if(!post)return; const i=Number(post.dataset.post);
    if(ev.target.closest('[data-like]')){saved.liked=saved.liked||{};saved.counts=saved.counts||{};const was=!!saved.liked[i];saved.liked[i]=!was;saved.counts[i]=(saved.counts[i]||counts[i])+(was?-1:1);const b=post.querySelectorAll('[data-like]');b.forEach(x=>{x.classList.toggle('liked',!was);if(x.tagName==='BUTTON'&&x.closest('.sd-tiktok-actions'))x.textContent=!was?'♥':'♡';});post.querySelectorAll('[data-count]').forEach(x=>x.textContent=saved.counts[i].toLocaleString());persist();}
    if(ev.target.closest('[data-comments]'))post.querySelector('.sd-comments').classList.toggle('open');
    if(ev.target.closest('[data-share]')){const b=ev.target.closest('[data-share]');b.textContent='✓ Copied';setTimeout(()=>{if(b.isConnected)b.textContent='↗ Share';},900);}
  });
  e.addEventListener('submit',ev=>{const form=ev.target.closest('.sd-comment-form');if(!form)return;ev.preventDefault();const input=form.querySelector('input'),v=input.value.trim();if(!v)return;const post=form.closest('.sd-post'),i=Number(post.dataset.post);saved.comments=saved.comments||{};saved.comments[i]=saved.comments[i]||seedComments[i].slice();saved.comments[i].push(v);const row=document.createElement('div');row.className='sd-comment';const b=document.createElement('b');b.textContent='@you';row.append(b,document.createTextNode(v));post.querySelector('.sd-comment-list').append(row);input.value='';persist();});
  return e;
}

function safariContent() {
  const el = document.createElement('div'); el.className = 'sf';
  const esc = escapeHTML, KEY = 'ije.safari.recent';
  let hist = [], pos = -1, recent = [];

    </div>
    <iframe class="sf-frame" title="Web page" referrerpolicy="no-referrer" sandbox="allow-scripts allow-forms allow-popups" hidden></iframe>
    <div class="sf-toast" hidden></div>

      </div>
      <div class="sf-tools">
        <button data-t="back" aria-label="Back">${I('<path d="M15 5l-7 7 7 7"/>')}</button>
        <button data-t="fwd" aria-label="Forward">${I('<path d="M9 5l7 7-7 7"/>')}</button>
        <button data-t="share" aria-label="Share">${I('<path d="M12 15V4M8 8l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1h-1"/>')}</button>

      </div>

    $q('.sf-rl').disabled = !showing;
  };
  const load = u => {
    prog.style.transition = 'none'; prog.style.width = '0%'; prog.style.opacity = 1; void prog.offsetWidth;

    frame.src = u;

  frame.addEventListener('load', () => {

    v = v.trim(); if (!v) return '';

}

    const views = {

      if (!t) { box.innerHTML = sec('Suggested') + `<div class="as-sugg">${['calculator', 'weather', 'notes', 'clock', 'games', 'video'].map(w => `<div data-s="${w}"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M16 16l5 5"/></svg>${w}</div>`).join('')}</div>`; return; }

applyWall(); syncCatalog(); syncTrollKlipShortcuts(); syncInstalledTweaks(); loadGifOverlay().then(()=>applyGifOverlay()).catch(()=>{}); applyDynamicIsland(); applyIconScale(); applyCompactGrid(); if (TWEAKS.motionEnabled && JB.inst.includes('motionicons')) { window.addEventListener('devicemotion', handleDeviceMotion, true); window.addEventListener('deviceorientation', handleDeviceOrientation, true); } build();


/* ============ HOME SCREEN ICON EDITING ============ */
const HOME_ORDER_KEY = 'ije.homeIconOrder.v1';
let editSuppressClick = false, editPressTimer = null, editDrag = null, editGhost = null;
const editBar = document.createElement('div');
editBar.id = 'editbar';
editBar.innerHTML = '<span>Hold and drag to rearrange</span><button type="button" id="edit-done">Done</button>';
home.append(editBar);
editBar.querySelector('#edit-done').addEventListener('click', exitHomeEdit);
function enterHomeEdit(){
  if(home.classList.contains('editing')) return;
  home.classList.add('editing');
  pager.style.touchAction='none';
  pager.style.webkitUserSelect='none';
  // Add a blank trailing page immediately, without rebuilding the icon being long-pressed.
  const blank=document.createElement('div'); blank.className='page edit-empty-page';
  blank.innerHTML='<div class="grid"></div>';
  const lib=track.querySelector('.page.lib');
  track.insertBefore(blank,lib||null);
  homePages++;
  N=homePages+1;
  dots.append(document.createElement('i'));
  setPos(0,false);
}
function exitHomeEdit(){
  clearTimeout(editPressTimer); editPressTimer=null;
  if(editDrag) finishHomeDrag();
  home.classList.remove('editing'); pager.style.touchAction='pan-y';
  stopEditEdgePaging();
  document.querySelectorAll('#home .app').forEach(a=>a.classList.remove('dragging','drop-target'));
  build();
}
function saveHomeOrder(){
  const ids=[];
  dock.querySelectorAll('.app[data-id]').forEach(n=>ids.push({id:n.dataset.id,dock:true,page:-1}));
  [...track.querySelectorAll(':scope > .page:not(.lib)')].forEach((page,pageIndex)=>{
    page.querySelectorAll(':scope > .grid > .app[data-id]').forEach(n=>ids.push({id:n.dataset.id,dock:false,page:pageIndex}));
  });
  const map=new Map(APPS.map(a=>[a.id,a]));
  ids.forEach(x=>{const a=map.get(x.id);if(a){a.dock=x.dock;a._homePage=x.dock?-1:x.page;}});
  const ordered=ids.map(x=>map.get(x.id)).filter(Boolean);
  APPS.forEach(a=>{if(!ordered.includes(a))ordered.push(a);});
  APPS.splice(0,APPS.length,...ordered);
  try{localStorage.setItem(HOME_ORDER_KEY,JSON.stringify(ids));}catch(_){}
}
function restoreHomeOrder(){
  try{
    const saved=JSON.parse(localStorage.getItem(HOME_ORDER_KEY)||'[]'); if(!Array.isArray(saved)||!saved.length)return;
    const map=new Map(APPS.map(a=>[a.id,a])); const ordered=[];
    saved.forEach(x=>{const a=map.get(x.id);if(a){a.dock=!!x.dock;if(!x.dock&&Number.isFinite(Number(x.page)))a._homePage=Math.max(0,Math.floor(Number(x.page)));else if(x.dock)a._homePage=-1;ordered.push(a);map.delete(x.id);}});
    ordered.push(...map.values()); APPS.splice(0,APPS.length,...ordered);
  }catch(_){}
}
function beginHomeDrag(node,x,y,pointerId){
  const app=byId(node.dataset.id); if(!app)return;
  // A long-pressed icon owns the pointer until drop: never let the pager interpret
  // the same movement as a normal Home Screen swipe.
  sx=null; lock=null; moved=true;
  editDrag={node,id:app.id,pointerId}; node.classList.add('dragging');
  // Do not capture the pointer on the icon: document-level capture listeners
  // track the finger reliably even after the icon is moved between page grids.
  editGhost=node.cloneNode(true); editGhost.id='edit-ghost'; editGhost.classList.remove('dragging');
  document.body.append(editGhost); moveEditGhost(x,y);
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}
}
function moveEditGhost(x,y){if(editGhost){editGhost.style.left=x+'px';editGhost.style.top=y+'px';}}
function finishHomeDrag(){
  if(!editDrag)return;
  editDrag.node.classList.remove('dragging');
  if(editGhost)editGhost.remove(); editGhost=null;
  stopEditEdgePaging();
  document.querySelectorAll('#home .drop-target').forEach(n=>n.classList.remove('drop-target'));
  editDrag=null; saveHomeOrder(); build(); home.classList.add('editing');
}
let editEdgeTimer=null, editEdgeDirection=0, editPointerX=0, editPointerY=0, editEdgeLastSwitch=0;
function stopEditEdgePaging(){
  clearTimeout(editEdgeTimer); editEdgeTimer=null; editEdgeDirection=0;
}
function scheduleEditEdgePaging(){
  if(editEdgeTimer||!editDrag||!editEdgeDirection)return;
  // A single delayed switch is more reliable on touch screens than a repeating
  // interval, which can race the track's CSS transition and reorder operation.
  editEdgeTimer=setTimeout(()=>{
    editEdgeTimer=null;
    if(!editDrag||!editEdgeDirection)return;
    const maxHome=Math.max(0,track.querySelectorAll(':scope > .page:not(.lib)').length-1);
    const next=clamp(idx+editEdgeDirection,0,maxHome);
    if(next===idx)return;
    idx=next;
    setPos(0,true);
    const destination=track.children[idx];
    const grid=destination&&!destination.classList.contains('lib')?destination.querySelector('.grid'):null;
    if(grid&&editDrag&&!grid.contains(editDrag.node))grid.append(editDrag.node);
    // Let the page settle before calculating the insertion slot. The floating
    // ghost remains attached to the finger throughout the transition.
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(editDrag){reorderAtPoint(editPointerX,editPointerY);}
      scheduleEditEdgePaging();
    }));
  },420);
}
function updateEditEdgePaging(x,y){
  editPointerX=x; editPointerY=y;
  if(!editDrag)return;
  const r=pager.getBoundingClientRect(), edge=Math.min(92,Math.max(64,r.width*.19));
  const dir=x<r.left+edge?-1:(x>r.right-edge?1:0);
  if(dir!==editEdgeDirection){stopEditEdgePaging();editEdgeDirection=dir;}
  if(dir)scheduleEditEdgePaging();
}
function reorderAtPoint(x,y){
  if(!editDrag)return;
  const node=editDrag.node;
  const dockRect=dock.getBoundingClientRect();
  if(y>=dockRect.top-18){
    const siblings=[...dock.querySelectorAll('.app')].filter(n=>n!==node);
    const target=siblings.find(n=>{const r=n.getBoundingClientRect();return x<r.left+r.width/2;});
    if(target)dock.insertBefore(node,target);else dock.append(node);
    return;
  }
  const page=track.children[clamp(idx,0,Math.max(0,N-2))];
  if(!page||page.classList.contains('lib'))return;
  const grid=page.querySelector('.grid'); if(!grid)return;
  const candidates=[...grid.querySelectorAll(':scope > .app')].filter(n=>n!==node);
  if(!candidates.length){grid.append(node);return;}
  let nearest=null,best=Infinity;
  for(const n of candidates){const r=n.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const d=(cx-x)**2+(cy-y)**2;if(d<best){best=d;nearest=n;}}
  if(!nearest)return;
  const r=nearest.getBoundingClientRect();
  const before=(y<r.top+r.height/2)||(Math.abs(y-(r.top+r.height/2))<r.height/2&&x<r.left+r.width/2);
  grid.insertBefore(node,before?nearest:nearest.nextSibling);
}
home.addEventListener('pointerdown',e=>{
  const node=e.target.closest('.app[data-id]'); if(!node||!home.contains(node))return;
  if(e.target.closest('#editbar'))return;
  clearTimeout(editPressTimer);
  const startX=e.clientX,startY=e.clientY;
  editPressTimer=setTimeout(()=>{
    editPressTimer=null;
    enterHomeEdit(); beginHomeDrag(node,startX,startY,e.pointerId); editSuppressClick=true;
  },520);
  node.dataset.pressX=String(startX);node.dataset.pressY=String(startY);
},{capture:true});
function cancelHomePressIfMoved(e){
  if(!editPressTimer)return;
  const node=document.querySelector('#home .app[data-press-x]');
  if(!node)return;
  const dx=e.clientX-Number(node.dataset.pressX||e.clientX),dy=e.clientY-Number(node.dataset.pressY||e.clientY);
  if(Math.hypot(dx,dy)>14){clearTimeout(editPressTimer);editPressTimer=null;}
}
function handleHomeEditPointerMove(e){
  cancelHomePressIfMoved(e);
  if(!editDrag)return;
  e.preventDefault(); e.stopPropagation();
  moveEditGhost(e.clientX,e.clientY);
  updateEditEdgePaging(e.clientX,e.clientY);
  reorderAtPoint(e.clientX,e.clientY);
}
document.addEventListener('pointermove',handleHomeEditPointerMove,{capture:true,passive:false});
function clearHomePress(){clearTimeout(editPressTimer);editPressTimer=null;document.querySelectorAll('#home .app[data-press-x]').forEach(n=>{delete n.dataset.pressX;delete n.dataset.pressY;});}
document.addEventListener('pointerup',()=>{clearHomePress();if(editDrag)finishHomeDrag();if(editSuppressClick)setTimeout(()=>{editSuppressClick=false;},120);},{capture:true});
document.addEventListener('pointercancel',()=>{clearHomePress();if(editDrag)finishHomeDrag();},{capture:true});

/* ============ DUPLICATE HOME SCREEN ICONS ============ */
const DUPLICATE_APPS_KEY = 'ije.duplicateHomeIcons.v1';
function readDuplicateRecords(){
  try { const value=JSON.parse(localStorage.getItem(DUPLICATE_APPS_KEY)||'[]'); return Array.isArray(value)?value.filter(x=>x&&typeof x.id==='string'&&typeof x.sourceId==='string'):[]; }
  catch(_){return [];}
}
function writeDuplicateRecords(records){try{localStorage.setItem(DUPLICATE_APPS_KEY,JSON.stringify(records));return true;}catch(_){return false;}}
function restoreDuplicateApps(){
  const pending=readDuplicateRecords();let changed=true,passes=0;
  while(changed&&pending.length&&passes++<=pending.length){
    changed=false;
    for(let i=pending.length-1;i>=0;i--){
      const rec=pending[i];if(byId(rec.id)){pending.splice(i,1);changed=true;continue;}
      const source=byId(rec.sourceId);if(!source)continue;
      APPS.push(Object.assign({},source,{id:rec.id,name:String(rec.name||(source.name+' Copy')),icon:Object.assign({},source.icon),dock:false,_homePage:Math.max(0,Math.floor(Number(rec.page)||0)),_duplicateSourceId:rec.sourceId}));
      pending.splice(i,1);changed=true;
    }
  }
}
function duplicateHomeIcon(id){
  const source=byId(id);if(!source)return;
  const template=source._duplicateSourceId?(byId(source._duplicateSourceId)||source):source;
  const name=source.name;
  const sourceNode=[...document.querySelectorAll('#home .app[data-id]')].find(n=>n.dataset.id===id);
  const sourcePage=sourceNode&&sourceNode.closest('.page:not(.lib)');
  const page=sourcePage?[...track.querySelectorAll(':scope > .page:not(.lib)')].indexOf(sourcePage):0;
  const newId='duplicate.'+Date.now().toString(36)+'.'+Math.random().toString(36).slice(2,8);
  const copy=Object.assign({},template,{id:newId,name,icon:Object.assign({},template.icon),dock:false,_homePage:Math.max(0,page),_duplicateSourceId:template.id});
  const at=APPS.indexOf(source);APPS.splice(at<0?APPS.length:at+1,0,copy);
  const records=readDuplicateRecords();records.push({id:newId,sourceId:template.id,name,page:Math.max(0,page)});writeDuplicateRecords(records);
  build();saveHomeOrder();home.classList.add('editing');
}

/* ============ DELETE APP MENU (edit mode) ============ */
const KEEP_APPS = ['env.jailed.sysinfo', 'app.plikzach', 'app.appstore'];
function getDeletedApps(){ try { const a = JSON.parse(localStorage.getItem('ije.deletedApps') || '[]'); return Array.isArray(a) ? a : []; } catch (_) { return []; } }
function appDeleted(id){ return getDeletedApps().includes(id); }
function deleteApp(id){
  const duplicateRecords=readDuplicateRecords();
  const keptDuplicateRecords=duplicateRecords.filter(x=>x.id!==id);
  if(keptDuplicateRecords.length!==duplicateRecords.length)writeDuplicateRecords(keptDuplicateRecords);
  const it = (typeof STORE_ITEMS !== 'undefined') ? STORE_ITEMS.find(x => x.appId === id) : null;
  if (it) storeRemove(it);
  else if (id === 'app.trollklip') removeTrollKlip();
  else {
    if (id.indexOf('trollklip.ipa.') === 0) {
      try { const items = JSON.parse(localStorage.getItem('ije.trollklip.apps') || '[]').filter(x => ('trollklip.ipa.' + encodeURIComponent(x.name)) !== id); localStorage.setItem('ije.trollklip.apps', JSON.stringify(items)); } catch (_) {}
    } else {
      const d = getDeletedApps(); if (!d.includes(id)) { d.push(id); try { localStorage.setItem('ije.deletedApps', JSON.stringify(d)); } catch (_) {} }
    }
    const i = APPS.findIndex(a => a.id === id); if (i >= 0) APPS.splice(i, 1);
  }
  build(); saveHomeOrder(); home.classList.add('editing');
}
function askDeleteApp(id){
  const app=byId(id);if(!app||document.getElementById('dlg'))return;
  const protectedApp=KEEP_APPS.includes(id);
  const d=document.createElement('div');d.id='dlg';
  d.innerHTML=`<div class="box" role="dialog" aria-modal="true"><div class="t">${escapeHTML(app.name)}</div><div class="m">Home Screen icon options</div><button type="button" data-a="duplicate">Duplicate Icon</button>${protectedApp?'':'<button type="button" class="del" data-a="del">Delete App</button>'}<button type="button" data-a="no">Cancel</button></div>`;
  $('#screen').append(d);d.offsetWidth;d.classList.add('on');
  const close=()=>{d.classList.remove('on');setTimeout(()=>d.remove(),220);};
  d.addEventListener('click',e=>{
    e.stopPropagation();const b=e.target.closest('button');
    if(!b){if(e.target===d)close();return;}
    if(b.dataset.a==='duplicate'){close();duplicateHomeIcon(id);}
    else if(b.dataset.a==='del'){close();deleteApp(id);}
    else close();
  });
}
